system:
  name: agricultural_price_monitor
  version: 1.0.0
  data_dir: ./data
  log_dir: ./logs
  log_retention_days: 90
  timezone: Asia/Shanghai
  daily_crawl_time: "07:00"
  config_reload_interval_minutes: 5
  max_concurrent_requests: 8
  request_timeout: 15
  memory_limit_mb: 512

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: null
  dedup_set_prefix: price_monitor:dedup
  progress_key: price_monitor:progress
  circuit_key_prefix: price_monitor:circuit
  fingerprint_ttl_seconds: 86400

scheduler:
  apscheduler_jobstores: default
  max_instances: 1
  coalesce: true
  misfire_grace_time: 3600

pipeline:
  fuzzy_match_threshold: 80
  alert_push_enabled: true

alert:
  single_day_change_pct: 15
  consecutive_days: 3
  consecutive_day_change_pct: 5
  wechat_webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY_HERE"
  admin_contacts:
    - admin1@example.com
  circuit_breaker_threshold: 5
  circuit_breaker_hours: 48

