<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市内涝监测与应急资源调度看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="response-level-iv">
    <div class="app-wrapper d-flex vh-100">
        <aside id="sidebar" class="sidebar bg-dark text-white d-flex flex-column">
            <div class="sidebar-header p-3 border-bottom border-secondary">
                <h5 class="mb-0"><i class="bi bi-droplet-fill text-primary me-2"></i><span class="sidebar-text">防汛调度中心</span></h5>
            </div>
            <nav class="sidebar-nav flex-grow-1 p-2">
                <ul class="nav flex-column">
                    <li class="nav-item mb-1">
                        <a href="#/dashboard" class="nav-link text-white rounded" data-route="dashboard">
                            <i class="bi bi-speedometer2 me-2"></i><span class="sidebar-text">总览看板</span>
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#/inspector" class="nav-link text-white rounded" data-route="inspector">
                            <i class="bi bi-clipboard-check me-2"></i><span class="sidebar-text">巡查上报</span>
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#/resource" class="nav-link text-white rounded" data-route="resource">
                            <i class="bi bi-box-seam me-2"></i><span class="sidebar-text">应急资源</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer p-3 border-top border-secondary">
                <button id="toggleSidebar" class="btn btn-outline-secondary btn-sm w-100">
                    <i class="bi bi-list"></i><span class="sidebar-text ms-2">收起菜单</span>
                </button>
            </div>
        </aside>

        <div class="main-content flex-grow-1 d-flex flex-column overflow-hidden">
            <header class="navbar navbar-dark bg-dark border-bottom border-secondary px-4 py-2">
                <div class="d-flex align-items-center">
                    <button id="mobileMenuBtn" class="btn btn-outline-light me-3 d-lg-none">
                        <i class="bi bi-list"></i>
                    </button>
                    <h6 class="mb-0 text-white-50" id="pageTitle">总览看板</h6>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-sm dropdown-toggle border-secondary text-white d-flex align-items-center" 
                                id="responseLevelBtn" data-bs-toggle="dropdown">
                            <span class="response-indicator me-2" id="responseIndicator"></span>
                            <span id="responseLevelText">Ⅳ级响应</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="responseLevelMenu">
                            <li><a class="dropdown-item response-level-item" data-level="I" href="#">
                                <span class="level-dot level-I me-2"></span>Ⅰ级响应（特别重大）
                            </a></li>
                            <li><a class="dropdown-item response-level-item" data-level="II" href="#">
                                <span class="level-dot level-II me-2"></span>Ⅱ级响应（重大）
                            </a></li>
                            <li><a class="dropdown-item response-level-item" data-level="III" href="#">
                                <span class="level-dot level-III me-2"></span>Ⅲ级响应（较大）
                            </a></li>
                            <li><a class="dropdown-item response-level-item active" data-level="IV" href="#">
                                <span class="level-dot level-IV me-2"></span>Ⅳ级响应（一般）
                            </a></li>
                        </ul>
                    </div>

                    <div class="position-relative">
                        <button class="btn btn-sm btn-outline-secondary text-white" id="alertDrawerBtn">
                            <i class="bi bi-bell"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="alertBadge">0</span>
                        </button>
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary text-white dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>调度主任
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>个人中心</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <main id="app" class="flex-grow-1 overflow-auto p-4 bg-body-tertiary"></main>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="alertDrawer" tabindex="-1">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title"><i class="bi bi-exclamation-triangle text-warning me-2"></i>告警信息中心</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0" id="alertList"></div>
    </div>

    <div class="modal fade" id="floodPointModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" id="floodModalHeader">
                    <h5 class="modal-title" id="floodModalTitle">易涝点详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="floodModalBody"></div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="js/data/mock.js"></script>
    <script src="js/store.js"></script>
    <script src="js/router.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/inspector.js"></script>
    <script src="js/pages/resource.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
