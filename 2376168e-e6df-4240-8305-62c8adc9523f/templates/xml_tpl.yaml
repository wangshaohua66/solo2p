name: XML清算文件模板
description: XML格式清算文件模板（典当行、融资租赁公司）
format: xml
encoding: UTF-8

xml:
  record_path: /ClearData/Records/Record
  encoding: UTF-8

fields:
  - name: biz_no
    source: BizNo
    type: string
    required: true

  - name: biz_type
    source: BizType
    type: string
    required: true

  - name: biz_date
    source: BizDate
    type: string
    required: true

  - name: src_inst_id
    source: SrcInstID
    type: string
    required: true

  - name: dst_inst_id
    source: DstInstID
    type: string
    required: true

  - name: amount
    source: Amount
    type: decimal
    required: true

  - name: currency
    source: Currency
    type: string
    default: CNY

  - name: direction
    source: Direction
    type: string
    required: true

  - name: payer_account
    source: Payer.Account
    type: string

  - name: payer_name
    source: Payer.Name
    type: string

  - name: payee_account
    source: Payee.Account
    type: string

  - name: payee_name
    source: Payee.Name
    type: string

  - name: summary
    source: Summary
    type: string

  - name: ref_no
    source: RefNo
    type: string
