format: xml
encoding: UTF-8
has_header: false
record_xpath: /ClearingData/RecordList/Record
fields:
  - name: biz_no
    source: /BizNo
    type: string
  - name: biz_type
    source: /BizType
    type: string
    default: TRANSFER
  - name: biz_date
    source: /BizDate
    type: date
    format: 2006-01-02
  - name: src_inst_id
    source: /SourceInst
    type: string
  - name: dst_inst_id
    source: /DestInst
    type: string
  - name: amount
    source: /Amount
    type: decimal
  - name: currency
    source: /Currency
    type: string
    default: CNY
  - name: direction
    source: /Direction
    type: string
  - name: payer_account
    source: /Payer/Account
    type: string
  - name: payer_name
    source: /Payer/Name
    type: string
  - name: payee_account
    source: /Payee/Account
    type: string
  - name: payee_name
    source: /Payee/Name
    type: string
  - name: summary
    source: /Summary
    type: string
  - name: ref_no
    source: /RefNo
    type: string
