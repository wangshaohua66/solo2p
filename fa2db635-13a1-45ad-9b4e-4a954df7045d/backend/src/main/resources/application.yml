server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wedding-suite-backend
  datasource:
    url: jdbc:h2:mem:wedding_suite;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: true
      path: /h2-console
  # redis:
  #   host: localhost
  #   port: 6379
  #   database: 0
  #   timeout: 3000ms
  #   lettuce:
  #     pool:
  #       max-active: 16
  #       max-idle: 8
  #       min-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  sql:
    init:
      mode: always
      schema-locations: 
      data-locations: classpath:data-h2.sql
      continue-on-error: true

