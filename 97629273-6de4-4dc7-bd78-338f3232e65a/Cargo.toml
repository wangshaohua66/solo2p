[package]
name = "patent-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Patent Agency Team"]
description = "Patent claim parsing, citation graph analysis and infringement comparison tool"

[[bin]]
name = "patent-analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.39"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
toml = "0.8"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
