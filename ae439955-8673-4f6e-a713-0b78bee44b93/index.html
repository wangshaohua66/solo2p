<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烟叶醇化仓储管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#/dashboard">
        <i class="bi bi-box-seam me-2"></i>烟叶醇化仓储管理
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#/dashboard" data-route="dashboard"><i class="bi bi-speedometer2 me-1"></i>总览看板</a></li>
          <li class="nav-item"><a class="nav-link" href="#/warehouse" data-route="warehouse"><i class="bi bi-grid-3x3-gap me-1"></i>库房垛位</a></li>
          <li class="nav-item"><a class="nav-link" href="#/flip-plan" data-route="flip-plan"><i class="bi bi-arrow-repeat me-1"></i>翻垛计划</a></li>
          <li class="nav-item"><a class="nav-link" href="#/tasting" data-route="tasting"><i class="bi bi-stars me-1"></i>品评记录</a></li>
          <li class="nav-item"><a class="nav-link" href="#/formula" data-route="formula"><i class="bi bi-filter-square me-1"></i>配方筛选</a></li>
        </ul>
        <span class="navbar-text">
          <i class="bi bi-person-circle me-1"></i><span id="currentUser">仓储管理员</span>
        </span>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 bg-light border-end p-3 sidebar">
        <h6 class="text-muted text-uppercase small mb-3">库房选择</h6>
        <div class="list-group" id="warehouseList">
        </div>
        <hr>
        <h6 class="text-muted text-uppercase small mb-3">快速统计</h6>
        <div class="small" id="quickStats"></div>
      </aside>
      <main class="col-md-9 col-lg-10 p-4" id="mainContent">
        <div class="text-center text-muted py-5">
          <div class="spinner-border" role="status"></div>
          <p class="mt-2">正在加载系统...</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailModalTitle">详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
        <div class="modal-footer" id="detailModalFooter"></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto" id="toastTitle">提示</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="store.js"></script>
  <script src="models/batch.js"></script>
  <script src="models/inspection.js"></script>
  <script src="utils/validator.js"></script>
  <script src="utils/chart-helper.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/warehouse.js"></script>
  <script src="views/flip-plan.js"></script>
  <script src="views/tasting.js"></script>
  <script src="views/formula.js"></script>
  <script src="app.js"></script>
</body>
</html>
