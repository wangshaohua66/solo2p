basePath: /
definitions:
  dto.AlertResolveRequest:
    properties:
      note:
        type: string
    required:
    - note
    type: object
  dto.BatchMaterialIn:
    properties:
      materialId:
        type: integer
      materialLot:
        type: string
      materialName:
        type: string
      quantityKg:
        minimum: 0
        type: number
      supplier:
        type: string
    required:
    - materialId
    - materialLot
    - materialName
    - quantityKg
    type: object
  dto.CreateBatchRequest:
    properties:
      notes:
        type: string
      recipeId:
        minimum: 1
        type: integer
      targetVolumeL:
        minimum: 1
        type: number
    required:
    - recipeId
    - targetVolumeL
    type: object
  dto.CreateMaterialRequest:
    properties:
      category:
        type: string
      code:
        type: string
      name:
        type: string
      safetyStock:
        type: number
      spec:
        type: string
      supplier:
        type: string
      unit:
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateQualityItemRequest:
    properties:
      applicableStages:
        type: string
      category:
        type: string
      code:
        type: string
      maxValue:
        type: number
      method:
        type: string
      minValue:
        type: number
      name:
        type: string
      required:
        type: boolean
      targetValue:
        type: number
      unit:
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateRecipeRequest:
    properties:
      abvTarget:
        type: number
      code:
        type: string
      description:
        type: string
      ibuTarget:
        type: number
      ingredients:
        items:
          $ref: '#/definitions/dto.RecipeIngredientIn'
        type: array
      name:
        type: string
      params:
        items:
          $ref: '#/definitions/dto.RecipeParamIn'
        type: array
      srmTarget:
        type: number
      style:
        type: string
    required:
    - code
    - name
    type: object
  dto.DeviationInfo:
    properties:
      log:
        $ref: '#/definitions/model.DeviationLog'
    type: object
  dto.ExportReportRequest:
    properties:
      batchId:
        type: integer
      reportType:
        type: string
      template:
        type: string
    required:
    - batchId
    - reportType
    type: object
  dto.FinishedGoodsInboundRequest:
    properties:
      batchId:
        type: integer
      location:
        type: string
      packageType:
        type: string
      productCode:
        type: string
      productName:
        type: string
      quantity:
        minimum: 1
        type: integer
      remarks:
        type: string
      unit:
        type: string
      volumeMl:
        type: integer
      warehouse:
        type: string
    required:
    - batchId
    - productCode
    - productName
    - quantity
    type: object
  dto.FinishedGoodsOutboundRequest:
    properties:
      finishedIds:
        items:
          type: integer
        minItems: 1
        type: array
      quantities:
        items:
          type: integer
        minItems: 1
        type: array
      refNo:
        type: string
      remarks:
        type: string
    required:
    - finishedIds
    - quantities
    type: object
  dto.LinkMaterialRequest:
    properties:
      materials:
        items:
          $ref: '#/definitions/dto.BatchMaterialIn'
        minItems: 1
        type: array
    required:
    - materials
    type: object
  dto.LoginRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserInfo'
    type: object
  dto.RawMaterialInboundRequest:
    properties:
      expiryDate:
        type: string
      location:
        type: string
      lotNo:
        type: string
      materialId:
        type: integer
      quantity:
        minimum: 0
        type: number
      receivedDate:
        type: string
      refNo:
        type: string
      remarks:
        type: string
      spec:
        type: string
      supplier:
        type: string
      warehouse:
        type: string
    required:
    - lotNo
    - materialId
    - quantity
    type: object
  dto.RecipeIngredientIn:
    properties:
      materialId:
        type: integer
      materialName:
        type: string
      notes:
        type: string
      quantityKg:
        minimum: 0
        type: number
      stage:
        type: string
    required:
    - materialId
    - materialName
    - quantityKg
    type: object
  dto.RecipeParamIn:
    properties:
      maxValue:
        type: number
      minValue:
        type: number
      paramName:
        type: string
      required:
        type: boolean
      stage:
        $ref: '#/definitions/model.BatchStage'
      targetValue:
        type: number
      tolerancePct:
        type: number
      unit:
        type: string
    required:
    - paramName
    - stage
    type: object
  dto.RecordParamRequest:
    properties:
      notes:
        type: string
      paramName:
        type: string
      paramValue:
        type: number
      stage:
        $ref: '#/definitions/model.BatchStage'
      unit:
        type: string
    required:
    - paramName
    - paramValue
    - stage
    type: object
  dto.ReviewSampleRequest:
    properties:
      freezeBatch:
        type: boolean
      notes:
        type: string
      overallPass:
        type: boolean
      retest:
        type: boolean
    type: object
  dto.SampleInfo:
    properties:
      results:
        items:
          $ref: '#/definitions/model.QualityResult'
        type: array
      sample:
        $ref: '#/definitions/model.QualitySample'
    type: object
  dto.SampleResultIn:
    properties:
      itemId:
        type: integer
      remarks:
        type: string
      resultValue:
        type: number
    required:
    - itemId
    - resultValue
    type: object
  dto.StageInfo:
    properties:
      completed:
        type: boolean
      params:
        items:
          $ref: '#/definitions/model.StageParam'
        type: array
      stage:
        $ref: '#/definitions/model.BatchStage'
      startedAt:
        type: string
    type: object
  dto.StockMovementInfo:
    properties:
      movement:
        $ref: '#/definitions/model.StockMovement'
    type: object
  dto.SubmitSampleRequest:
    properties:
      batchId:
        type: integer
      notes:
        type: string
      results:
        items:
          $ref: '#/definitions/dto.SampleResultIn'
        minItems: 1
        type: array
      stage:
        $ref: '#/definitions/model.BatchStage'
    required:
    - batchId
    - results
    - stage
    type: object
  dto.TraceChainResponse:
    properties:
      batch:
        $ref: '#/definitions/model.Batch'
      deviations:
        items:
          $ref: '#/definitions/dto.DeviationInfo'
        type: array
      materials:
        items:
          $ref: '#/definitions/model.BatchMaterial'
        type: array
      movements:
        items:
          $ref: '#/definitions/dto.StockMovementInfo'
        type: array
      qualitySamples:
        items:
          $ref: '#/definitions/dto.SampleInfo'
        type: array
      recipe:
        $ref: '#/definitions/model.Recipe'
      stages:
        items:
          $ref: '#/definitions/dto.StageInfo'
        type: array
    type: object
  dto.TransitionStageRequest:
    properties:
      notes:
        type: string
      toStage:
        $ref: '#/definitions/model.BatchStage'
    required:
    - toStage
    type: object
  dto.UserInfo:
    properties:
      email:
        type: string
      id:
        type: integer
      realName:
        type: string
      role:
        $ref: '#/definitions/model.Role'
      username:
        type: string
    type: object
  model.AsyncTask:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      errorMsg:
        type: string
      id:
        type: string
      progress:
        type: integer
      result:
        type: string
      status:
        $ref: '#/definitions/model.TaskStatus'
      taskType:
        type: string
      updatedAt:
        type: string
    type: object
  model.Batch:
    properties:
      actualVolumeL:
        type: number
      agingStart:
        type: string
      batchNo:
        type: string
      bottlingStart:
        type: string
      brewerId:
        type: integer
      brewerName:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      currentStage:
        $ref: '#/definitions/model.BatchStage'
      fermentingStart:
        type: string
      id:
        type: integer
      mashingStart:
        type: string
      notes:
        type: string
      recipeId:
        type: integer
      recipeName:
        type: string
      recipeVersion:
        type: integer
      status:
        $ref: '#/definitions/model.BatchStatus'
      targetVolumeL:
        type: number
      updatedAt:
        type: string
    type: object
  model.BatchMaterial:
    properties:
      batchId:
        type: integer
      id:
        type: integer
      materialId:
        type: integer
      materialLot:
        type: string
      materialName:
        type: string
      quantityKg:
        type: number
      supplier:
        type: string
    type: object
  model.BatchStage:
    enum:
    - mashing
    - fermenting
    - aging
    - bottling
    - completed
    - frozen
    - rejected
    type: string
    x-enum-varnames:
    - StageMashing
    - StageFermenting
    - StageAging
    - StageBottling
    - StageCompleted
    - StageFrozen
    - StageRejected
  model.BatchStatus:
    enum:
    - active
    - frozen
    - completed
    - rejected
    type: string
    x-enum-varnames:
    - BatchStatusActive
    - BatchStatusFrozen
    - BatchStatusCompleted
    - BatchStatusRejected
  model.DeviationLog:
    properties:
      actualValue:
        type: number
      batchId:
        type: integer
      batchNo:
        type: string
      createdAt:
        type: string
      deviationPct:
        type: number
      handleNote:
        type: string
      handled:
        type: boolean
      handledAt:
        type: string
      handlerId:
        type: integer
      id:
        type: integer
      paramName:
        type: string
      stage:
        $ref: '#/definitions/model.BatchStage'
      standardValue:
        type: number
      thresholdPct:
        type: number
    type: object
  model.InventoryType:
    enum:
    - raw_material
    - finished
    type: string
    x-enum-varnames:
    - InventoryRawMaterial
    - InventoryFinished
  model.QualityItem:
    properties:
      active:
        type: boolean
      applicableStages:
        type: string
      category:
        type: string
      code:
        type: string
      createdAt:
        type: string
      createdBy:
        type: integer
      id:
        type: integer
      maxValue:
        type: number
      method:
        type: string
      minValue:
        type: number
      name:
        type: string
      required:
        type: boolean
      targetValue:
        type: number
      unit:
        type: string
    type: object
  model.QualityResult:
    properties:
      id:
        type: integer
      isPass:
        type: boolean
      itemCode:
        type: string
      itemId:
        type: integer
      itemName:
        type: string
      remarks:
        type: string
      resultValue:
        type: number
      sampleId:
        type: integer
      testedAt:
        type: string
      testedBy:
        type: integer
      unit:
        type: string
    type: object
  model.QualitySample:
    properties:
      batchId:
        type: integer
      batchNo:
        type: string
      id:
        type: integer
      notes:
        type: string
      overallPass:
        type: boolean
      retestOfId:
        type: integer
      reviewedAt:
        type: string
      reviewedBy:
        type: integer
      sampleNo:
        type: string
      sampledAt:
        type: string
      sampledBy:
        type: integer
      sampledByName:
        type: string
      stage:
        $ref: '#/definitions/model.BatchStage'
      status:
        $ref: '#/definitions/model.QualityStatus'
    type: object
  model.QualityStatus:
    enum:
    - pending
    - passed
    - failed
    - retest
    - reviewed
    type: string
    x-enum-varnames:
    - QualityPending
    - QualityPassed
    - QualityFailed
    - QualityRetest
    - QualityReviewed
  model.Recipe:
    properties:
      abvTarget:
        type: number
      active:
        type: boolean
      code:
        type: string
      createdAt:
        type: string
      createdBy:
        type: integer
      description:
        type: string
      ibuTarget:
        type: number
      id:
        type: integer
      name:
        type: string
      srmTarget:
        type: number
      style:
        type: string
      version:
        type: integer
    type: object
  model.Role:
    enum:
    - brewer
    - qc
    - warehouse
    - compliance
    - admin
    type: string
    x-enum-varnames:
    - RoleBrewer
    - RoleQC
    - RoleWarehouse
    - RoleCompliance
    - RoleAdmin
  model.StageParam:
    properties:
      batchId:
        type: integer
      id:
        type: integer
      notes:
        type: string
      paramName:
        type: string
      paramValue:
        type: number
      recordedAt:
        type: string
      recordedBy:
        type: integer
      stage:
        $ref: '#/definitions/model.BatchStage'
      unit:
        type: string
    type: object
  model.StockMovement:
    properties:
      batchId:
        type: integer
      createdAt:
        type: string
      direction:
        type: string
      finishedId:
        type: integer
      id:
        type: integer
      materialId:
        type: integer
      materialLot:
        type: string
      moveNo:
        type: string
      operatorId:
        type: integer
      operatorName:
        type: string
      quantity:
        type: number
      refNo:
        type: string
      remarks:
        type: string
      type:
        $ref: '#/definitions/model.InventoryType'
    type: object
  model.TaskStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusRunning
    - TaskStatusCompleted
    - TaskStatusFailed
  util.PageResult:
    properties:
      items: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  util.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      traceId:
        type: string
    type: object
info:
  contact: {}
  description: 支撑从原料入库到灌装出库的全链路批次管理与质检 RESTful API。
  title: 精酿啤酒批次生产追踪与质量合规系统 API
  version: 1.0.0
paths:
  /api/v1/alerts:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: true/false
        in: query
        name: resolved
        type: string
      - description: info/warning/critical
        in: query
        name: level
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  $ref: '#/definitions/util.PageResult'
              type: object
      summary: 查询告警列表
      tags:
      - 告警管理
  /api/v1/alerts/{id}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 告警ID
        in: path
        name: id
        required: true
        type: integer
      - description: 处理说明
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AlertResolveRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.Response'
      summary: 处理告警
      tags:
      - 告警管理
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
      summary: 用户登录
      tags:
      - 认证
  /api/v1/batches:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: '批次状态: active/frozen/completed/rejected'
        in: query
        name: status
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20
        in: query
        name: pageSize
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/util.PageResult'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.Batch'
                        type: array
                    type: object
              type: object
      summary: 分页查询批次列表
      tags:
      - 批次管理
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  additionalProperties:
                    type: integer
                  type: object
              type: object
      summary: 创建酿造批次
      tags:
      - 批次管理
  /api/v1/batches/{id}:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Batch'
              type: object
      summary: 查询批次详情
      tags:
      - 批次管理
  /api/v1/batches/{id}/materials:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.BatchMaterial'
                  type: array
              type: object
      summary: 查询批次关联的原料
      tags:
      - 批次管理
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      - description: 原料列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LinkMaterialRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.Response'
      summary: 关联批次使用的原料批次并扣减库存
      tags:
      - 批次管理
  /api/v1/batches/{id}/params:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      - description: '阶段: mashing/fermenting/aging/bottling'
        in: query
        name: stage
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.StageParam'
                  type: array
              type: object
      summary: 查询批次某阶段的参数记录
      tags:
      - 批次管理
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      - description: 参数信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RecordParamRequest'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  additionalProperties:
                    type: integer
                  type: object
              type: object
      summary: 录入阶段工艺参数
      tags:
      - 批次管理
  /api/v1/batches/{id}/transition:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标阶段
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransitionStageRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.Response'
      summary: 切换批次阶段（状态机流转）
      tags:
      - 批次管理
  /api/v1/deviations:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: true只看已处理, false只看未处理, 空=全部
        in: query
        name: handled
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.DeviationLog'
                  type: array
              type: object
      summary: 查询工艺偏差日志
      tags:
      - 告警管理
  /api/v1/inventory/finished:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 批次ID
