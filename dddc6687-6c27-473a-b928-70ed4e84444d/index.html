<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>稼穑 · 区域品种试验管理平台</title>
  <meta name="description" content="区域农作物品种试验数据汇总、稳定性分析与审定报告一体化平台" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Spline+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="app-boot" class="app-boot">
    <div class="boot-mark"><i class="bi bi-flower1"></i></div>
    <div class="boot-text">稼穑 · 区域品种试验管理平台</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="切换菜单">
        <i class="bi bi-list"></i>
      </button>
      <a class="brand" href="#/dashboard">
        <span class="brand-mark"><i class="bi bi-flower1"></i></span>
        <span class="brand-text">
          <span class="brand-title">稼穑</span>
          <span class="brand-sub">区域品种试验管理平台</span>
        </span>
      </a>
    </div>

    <nav class="crop-tabs" id="cropTabs" aria-label="作物切换"></nav>

    <div class="topbar-right">
      <div class="year-selector">
        <i class="bi bi-calendar3"></i>
        <select id="yearSelector" class="form-select form-select-sm" aria-label="年度选择"></select>
      </div>
      <div class="storage-meter" id="storageMeter" title="本地存储用量">
        <i class="bi bi-device-ssd"></i>
        <span class="sm-value">0%</span>
      </div>
    </div>
  </header>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="side-group">
          <div class="side-group-label">总览</div>
          <a class="side-link" href="#/dashboard" data-route="dashboard">
            <i class="bi bi-grid-1x2"></i><span>工作台</span>
          </a>
        </div>
        <div class="side-group">
          <div class="side-group-label">试验管理</div>
          <a class="side-link" href="#/trials" data-route="trials">
            <i class="bi bi-clipboard-data"></i><span>方案配置</span>
          </a>
          <a class="side-link" href="#/data-entry" data-route="data-entry">
            <i class="bi bi-pencil-square"></i><span>数据录入</span>
          </a>
          <a class="side-link" href="#/validation" data-route="validation">
            <i class="bi bi-shield-exclamation"></i><span>数据校验</span>
          </a>
        </div>
        <div class="side-group">
          <div class="side-group-label">分析评估</div>
          <a class="side-link" href="#/analysis" data-route="analysis">
            <i class="bi bi-bar-chart-line"></i><span>多点汇总</span>
          </a>
          <a class="side-link" href="#/gge" data-route="gge">
            <i class="bi bi-diagram-3"></i><span>GGE双标图</span>
          </a>
          <a class="side-link" href="#/compare" data-route="compare">
            <i class="bi bi-graph-up-arrow"></i><span>品种比较</span>
          </a>
        </div>
        <div class="side-group">
          <div class="side-group-label">审定输出</div>
          <a class="side-link" href="#/reports" data-route="reports">
            <i class="bi bi-file-earmark-text"></i><span>审定报告</span>
          </a>
        </div>
        <div class="side-foot">
          <div class="seed-card">
            <i class="bi bi-database-fill-gear"></i>
            <div>
              <div class="sf-title">本地数据引擎</div>
              <div class="sf-sub">localStorage · 离线可用</div>
            </div>
          </div>
          <button class="side-reset" id="resetDataBtn"><i class="bi bi-arrow-repeat"></i> 重置示例数据</button>
        </div>
      </div>
    </aside>

    <main class="app-main" id="app-main" tabindex="-1">
      <div class="page-loader" id="pageLoader"><div class="spinner"></div></div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <script src="js/data-store.js"></script>
  <script src="js/analysis-engine.js"></script>
  <script src="js/chart-renderer.js"></script>
  <script src="js/report-generator.js"></script>
  <script src="js/trial-form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
