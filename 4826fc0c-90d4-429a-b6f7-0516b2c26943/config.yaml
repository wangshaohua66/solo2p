ocr:
  tesseract_cmd: /usr/local/bin/tesseract
  tesseract_lang: eng
  preprocessing:
    denoise_kernel: 3
    threshold_method: adaptive
    adaptive_block_size: 11
    adaptive_c: 2
    morph_kernel:
    - 2
    - 2
    scale_factor: 2.0
  digit_templates_dir: templates/digits
  custom_config: --psm 6 --oem 3 -c tessedit_char_whitelist=0123456789.-%
console_ui:
  refresh_interval: 0.5
  color_scheme:
    header: cyan
    instrument_idle: green
    instrument_busy: yellow
    instrument_error: red
    log_info: white
    log_warning: yellow
    log_error: red
    log_success: green
    progress_bar: blue
