<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩管理 - 职业技能鉴定管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            transition: all var(--transition-base);
            cursor: pointer;
            background: var(--bg-white);
        }
        
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .upload-zone .upload-icon {
            font-size: 3rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            transition: all var(--transition-base);
        }
        
        .upload-zone:hover .upload-icon,
        .upload-zone.dragover .upload-icon {
            color: var(--primary-color);
        }
        
        .progress {
            height: 8px;
            border-radius: var(--radius-sm);
        }
        
        .progress-bar {
            background: var(--primary-color);
            border-radius: var(--radius-sm);
            transition: width 0.3s ease;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-item {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        
        .stat-item .stat-num {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .stat-item.total .stat-num { color: var(--primary-color); }
        .stat-item.success .stat-num { color: var(--success-color); }
        .stat-item.failed .stat-num { color: var(--danger-color); }
        
        .stat-item .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .filter-bar {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }
        
        .error-message {
            background: var(--danger-light);
            border: 1px solid var(--danger-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            margin-top: 0.5rem;
            color: var(--danger-color);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-tabs {
            border-bottom: 2px solid var(--border-color);
        }
        
        .nav-tabs .nav-link {
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 1rem 1.5rem;
            margin-bottom: -2px;
            border-radius: 0;
            position: relative;
        }
        
        .nav-tabs .nav-link:hover {
            color: var(--primary-color);
            background: transparent;
        }
        
        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            background: transparent;
            border-bottom: 2px solid var(--primary-color);
        }
        
        .nav-tabs .nav-link.active::after {
            display: none;
        }
        
        .tab-content {
            padding-top: 1.5rem;
        }
        
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-md);
        }
        
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-light);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        
        .edit-cell {
            cursor: pointer;
            transition: all var(--transition-base);
        }
        
        .edit-cell:hover {
            background: var(--primary-light);
        }
        
        .edit-input {
            width: 100%;
            padding: 0.375rem 0.5rem;
            border: 1px solid var(--primary-color);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
        }
        
        .publish-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title"><i class="bi bi-file-earmark-check"></i> 成绩管理</h1>
            <p class="page-subtitle">成绩录入、复核与公示管理</p>
        </div>
        
        <div class="card">
            <div class="card-body p-0">

                                <select class="form-select" id="examPeriod">

                                    <option value="202403">2024年3月职业技能鉴定考试</option>

                            </div>
                        </div>
                        
                        <div class="upload-zone" id="uploadZone">

                        </div>
                        
                        <div class="mt-3" id="progressArea" style="display: none;">
                            <div class="d-flex justify-content-between mb-2">
                                <span>上传进度</span>
                                <span id="progressText">0%</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>

                            <div class="stats-row mt-4">

                                <div class="stat-item failed">

                                <button class="btn btn-outline-secondary" id="clearBtn">

                                <button class="btn btn-outline-primary" id="downloadTemplateBtn">
                                    <i class="bi bi-download"></i> 下载模板

                            </div>

                                    发现 <span id="errorCount">0</span> 条错误数据，请修正后重新提交
                                </div>
                            </div>
                            
                            <div class="table-container">

                                </div>
                                <div class="col-md-3">

                                        <i class="bi bi-search"></i> 查询
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="table-container">
                            <table class="table table-hover">
                                <thead>

                                        <th>考期</th>
                                        <th>工种</th>
                                        <th>姓名</th>
                                        <th>身份证号</th>
                                        <th>准考证号</th>

                                <div class="col-md-3">
                                    <label class="form-label">工种</label>
                                    <select class="form-select" id="publicProfession">
                                        <option value="">全部工种</option>
                                        <option value="电工">电工</option>
                                        <option value="焊工">焊工</option>

    <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">

                <div class="modal-header">
                    <h5 class="modal-title" id="reviewModalLabel">成绩复核</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="reviewScoreInfo" class="mb-4">
                    </div>
                    <div class="form-group">
                        <label class="form-label">复核结果 <span class="text-danger">*</span></label>
                        <select class="form-select" id="reviewResult">
                            <option value="">请选择复核结果</option>
                            <option value="passed">复核通过</option>
                            <option value="rejected">驳回修改</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">复核意见 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="reviewComment" rows="4" placeholder="请输入复核意见..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitReviewBtn">
                        <i class="bi bi-check-circle"></i> 提交复核
                    </button>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        $(function() {
            if (!checkLogin()) return;
            renderNavbar('score');
            
            initUploadZone();
            loadReviewData();
            loadPublicData();
            
            $('#clearBtn').on('click', function() {
                $('#fileInput').val('');
                $('#resultArea').hide();
                $('#progressArea').hide();
                $('#progressBar').css('width', '0%');
                $('#progressText').text('0%');
            });
            
            $('#downloadTemplateBtn').on('click', function() {
                showInfo('模板下载功能');
            });
            
            $('#submitScoresBtn').on('click', function() {
                var successCount = parseInt($('#successCount').text());
                if (successCount === 0) {
                    showWarning('没有校验通过的数据');
                    return;
                }
                confirmDialog('确定提交 ' + successCount + ' 条成绩数据吗？', function() {
                    showSuccess('成绩提交成功');
                });
            });
            
            $('#searchReviewBtn').on('click', loadReviewData);
            $('#searchPublicBtn').on('click', loadPublicData);
            
            $('#submitReviewBtn').on('click', function() {
                var result = $('#reviewResult').val();
                var comment = $('#reviewComment').val().trim();
                
                if (!result) {
                    showError('请选择复核结果');
                    return;
                }
                if (!comment) {
                    showError('请输入复核意见');
                    return;
                }
                
                showSuccess('复核提交成功');
                $('#reviewModal').modal('hide');
                loadReviewData();
            });
        });
        
        function initUploadZone() {
            var $uploadZone = $('#uploadZone');
            var $fileInput = $('#fileInput');
            
            $uploadZone.on('click', function() {
                $fileInput.click();
            });
            
            $fileInput.on('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    handleFileUpload(file);
                }
            });
            
            $uploadZone.on('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $uploadZone.addClass('dragover');
            });
            
            $uploadZone.on('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $uploadZone.removeClass('dragover');
            });
            
            $uploadZone.on('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $uploadZone.removeClass('dragover');
                
                var files = e.originalEvent.dataTransfer.files;
                if (files.length > 0) {
                    handleFileUpload(files[0]);
                }
            });
        }
        
        function handleFileUpload(file) {
            var examPeriod = $('#examPeriod').val();
            if (!examPeriod) {
                showError('请先选择考期');
                return;
            }
            
            var validExtensions = ['.xlsx', '.xls'];
            var fileName = file.name.toLowerCase();
            var isValid = validExtensions.some(function(ext) {
                return fileName.endsWith(ext);
            });
            
            if (!isValid) {
                showError('请上传Excel文件（.xlsx 或 .xls 格式）');
                return;
            }
            
            $('#progressArea').show();
            simulateUpload(file);
        }
        
        function simulateUpload(file) {
            var progress = 0;
            var $progressBar = $('#progressBar');
            var $progressText = $('#progressText');
            
            var interval = setInterval(function() {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    parseExcelFile(file);
                }
                $progressBar.css('width', progress + '%');
                $progressText.text(Math.floor(progress) + '%');
            }, 100);
        }
        
        function parseExcelFile(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, { type: 'array' });
                var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                var jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                validateAndDisplayData(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }
        
        function validateAndDisplayData(data) {
            if (data.length < 2) {
                showError('Excel文件内容为空');
                return;
            }
            
            var headers = data[0];
            var rows = data.slice(1);
            var results = [];
            var successCount = 0;
            var failedCount = 0;
            
            rows.forEach(function(row, index) {
                var rowData = {
                    rowNum: index + 2,
                    name: row[0] || '',
                    idCard: row[1] || '',
                    examNumber: row[2] || '',
                    theoryScore: row[3] || '',
                    practiceScore: row[4] || '',
                    errors: []
                };
                
                if (!rowData.name) rowData.errors.push('姓名不能为空');
                if (!rowData.idCard) {
                    rowData.errors.push('身份证号不能为空');
                } else if (!/^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]$/.test(rowData.idCard)) {
                    rowData.errors.push('身份证号格式不正确');
                }
                if (!rowData.examNumber) rowData.errors.push('准考证号不能为空');
                
                var theory = parseFloat(rowData.theoryScore);
                if (rowData.theoryScore === '' || isNaN(theory) || theory < 0 || theory > 100) {
                    rowData.errors.push('理论成绩必须是0-100之间的数字');
                }
                
                var practice = parseFloat(rowData.practiceScore);
                if (rowData.practiceScore === '' || isNaN(practice) || practice < 0 || practice > 100) {
                    rowData.errors.push('实操成绩必须是0-100之间的数字');
                }
                
                if (!isNaN(theory) && !isNaN(practice)) {
                    rowData.finalScore = ((theory * 0.4) + (practice * 0.6)).toFixed(1);
                } else {
                    rowData.finalScore = '-';
                }
                
                rowData.valid = rowData.errors.length === 0;
                if (rowData.valid) successCount++;
                else failedCount++;
                
                results.push(rowData);
            });
            
            $('#totalCount').text(rows.length);
            $('#successCount').text(successCount);
            $('#failedCount').text(failedCount);
            
            if (failedCount > 0) {
                $('#errorSummary').show();
                $('#errorCount').text(failedCount);
            } else {
                $('#errorSummary').hide();
            }
            
            renderResultTable(results);
            $('#resultArea').show();
        }
        
        function renderResultTable(data) {
            var $tbody = $('#resultTableBody');
            $tbody.empty();
            
            data.forEach(function(row) {
                var rowClass = row.valid ? '' : 'error-row';
                var statusClass = row.valid ? 'badge-success' : 'badge-danger';
                var statusText = row.valid ? '通过' : '错误';
                
                var html = '<tr class="' + rowClass + '" data-row="' + row.rowNum + '">' +
                    '<td>' + row.rowNum + '</td>' +
                    '<td class="edit-cell" data-field="name">' + row.name + '</td>' +
                    '<td class="edit-cell" data-field="idCard">' + row.idCard + '</td>' +
                    '<td class="edit-cell" data-field="examNumber">' + row.examNumber + '</td>' +
                    '<td class="edit-cell" data-field="theoryScore">' + row.theoryScore + '</td>' +
                    '<td class="edit-cell" data-field="practiceScore">' + row.practiceScore + '</td>' +
                    '<td>' + row.finalScore + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>' +
                    '<td>' + (row.errors.length > 0 ? row.errors.join('；') : '-') + '</td>' +
                    '<td>' + (row.valid ? 
                        '<span class="text-muted">无需操作</span>' : 
                        '<button class="btn btn-sm btn-outline-primary" onclick="editRow(this)"><i class="bi bi-pencil"></i> 修正</button>') +
                    '</td>' +
                '</tr>';
                
                $tbody.append(html);
            });
        }
        
        function editRow(btn) {
            var $tr = $(btn).closest('tr');
            var $cells = $tr.find('.edit-cell');
            
            $cells.each(function() {
                var $cell = $(this);
                var value = $cell.text().trim();
                var field = $cell.data('field');
                $cell.html('<input type="text" class="edit-input" data-field="' + field + '" value="' + value + '">');
            });
            
            $(btn).html('<i class="bi bi-check"></i> 保存').removeClass('btn-outline-primary').addClass('btn-primary').attr('onclick', 'saveRow(this)');
        }
        
        function saveRow(btn) {
            var $tr = $(btn).closest('tr');
            var $inputs = $tr.find('.edit-input');
            
            $inputs.each(function() {
                var $input = $(this);
                var value = $input.val().trim();
                var field = $input.data('field');
                $input.closest('td').text(value).attr('data-field', field);
            });
            
            validateSingleRow($tr);
            $(btn).html('<i class="bi bi-pencil"></i> 修正').removeClass('btn-primary').addClass('btn-outline-primary').attr('onclick', 'editRow(this)');
        }
        
        function validateSingleRow($tr) {
            var name = $tr.find('td[data-field="name"]').text().trim();
            var idCard = $tr.find('td[data-field="idCard"]').text().trim();
            var examNumber = $tr.find('td[data-field="examNumber"]').text().trim();
            var theoryScore = $tr.find('td[data-field="theoryScore"]').text().trim();
            var practiceScore = $tr.find('td[data-field="practiceScore"]').text().trim();
            var errors = [];
            
            if (!name) errors.push('姓名不能为空');
            if (!idCard) errors.push('身份证号不能为空');
            else if (!/^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]$/.test(idCard)) errors.push('身份证号格式不正确');
            if (!examNumber) errors.push('准考证号不能为空');
            
            var theory = parseFloat(theoryScore);
            if (theoryScore === '' || isNaN(theory) || theory < 0 || theory > 100) errors.push('理论成绩必须是0-100之间的数字');
            
            var practice = parseFloat(practiceScore);
            if (practiceScore === '' || isNaN(practice) || practice < 0 || practice > 100) errors.push('实操成绩必须是0-100之间的数字');
            
            var finalScore = '-';
            if (!isNaN(theory) && !isNaN(practice)) {
                finalScore = ((theory * 0.4) + (practice * 0.6)).toFixed(1);
            }
            
            var $finalTd = $tr.find('td:eq(6)');
            $finalTd.text(finalScore);
            
            var $statusTd = $tr.find('td:eq(7)');
            var $errorTd = $tr.find('td:eq(8)');
            
            if (errors.length > 0) {
                $tr.addClass('error-row');
                $statusTd.html('<span class="badge badge-danger">错误</span>');
                $errorTd.text(errors.join('；'));
            } else {
                $tr.removeClass('error-row');
                $statusTd.html('<span class="badge badge-success">通过</span>');
                $errorTd.text('-');
                updateStats();
            }
        }
        
        function updateStats() {
            var total = $('#resultTableBody tr').length;
            var success = $('#resultTableBody tr:not(.error-row)').length;
            var failed = total - success;
            
            $('#totalCount').text(total);
            $('#successCount').text(success);
            $('#failedCount').text(failed);
            
            if (failed > 0) {
                $('#errorSummary').show();
                $('#errorCount').text(failed);
            } else {
                $('#errorSummary').hide();
            }
        }

        function renderPagination(container, currentPage, totalPages, pageSize) {
            var $pagination = $(container);
            $pagination.empty();
            
            var html = '';
            html += '<li class="page-item ' + (currentPage === 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="return false;">上一页</a></li>';
            
            for (var i = 1; i <= Math.min(totalPages, 5); i++) {
                html += '<li class="page-item ' + (currentPage === i ? 'active' : '') + '"><a class="page-link" href="#" onclick="return false;">' + i + '</a></li>';
            }
            
            if (totalPages > 5) {
                html += '<li class="page-item disabled"><a class="page-link" href="#" onclick="return false;">...</a></li>';
                html += '<li class="page-item"><a class="page-link" href="#" onclick="return false;">' + totalPages + '</a></li>';
            }
            
            html += '<li class="page-item ' + (currentPage === totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="return false;">下一页</a></li>';
            
            $pagination.html(html);
        }
