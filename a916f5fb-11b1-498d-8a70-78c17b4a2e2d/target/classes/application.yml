server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: tobacco-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tobacco_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.tobacco.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: tobacco-admin-secret-key-for-jwt-token-generation-please-change-in-production
  expiration: 7200
  refresh-expiration: 604800
  header: Authorization
  prefix: Bearer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'auth'
      display-name: '认证授权'
      paths-to-match: '/auth/**'
    - group: 'license'
      display-name: '许可证管理'
      paths-to-match: '/license/**'
    - group: 'inspection'
      display-name: '稽查执法'
      paths-to-match: '/inspection/**'
    - group: 'order'
      display-name: '订货管理'
      paths-to-match: '/order/**'
    - group: 'delivery'
      display-name: '配送调度'
      paths-to-match: '/delivery/**'
    - group: 'credit'
      display-name: '信用评级'
      paths-to-match: '/credit/**'
    - group: 'report'
      display-name: '统计报表'
      paths-to-match: '/report/**'

delivery:
  vehicle:
    max-load: 800
    count: 48
    fleet-count: 6
  time-window:
    start: "08:00"
    end: "17:00"

quota:
  base-quota-per-tier: 50
  credit-coefficient:
    AAA: 1.3
    AA: 1.15
    A: 1.0
    BBB: 0.85
    BB: 0.7
    B: 0.5
    C: 0.3
    D: 0.1

inspection:
  base-frequency: 1
  risk-level-multiplier:
    high: 3
    medium: 2
    low: 1

credit:
  base-score: 100
  min-score: 0
  max-score: 120
  repair-periods: 6
