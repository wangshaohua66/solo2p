[package]
name = "dns-sec"
version = "1.0.0"
edition = "2021"
description = "DNS Security Monitoring and Emergency Response Tool"
authors = ["DNS Security Team"]

[[bin]]
name = "dns-sec"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "color"] }
tokio = { version = "1.35", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
trust-dns-resolver = "0.23"
whois-rust = "1.5"
ring = "0.17"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
url = "2.5"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
termcolor = "1.4"
prettytable-rs = "0.10"
dialoguer = "0.11"
walkdir = "2.4"
sha2 = "0.10"
hex = "0.4"
data-encoding = "2.5"
rayon = "1.8"
num_cpus = "1.16"
lru = "0.12"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
