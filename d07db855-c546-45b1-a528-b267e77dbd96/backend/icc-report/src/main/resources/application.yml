server:
  port: 8084

spring:
  application:
    name: icc-report
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/iccert?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
  mail:
    enabled: false
    host: smtp.qq.com
    port: 465
    username: noreply@iccert.gov.cn
    password: your-smtp-authorization-code
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    charset: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.iccert.report.entity
  configuration:
    map-underscore-to-camel-case: true

certificate:
  reminder:
    advance-days: 60

notification:
  sms:
    enabled: false
    gateway-url: https://dysmsapi.aliyuncs.com/sms/send
    api-key: your-sms-api-key
    sign-name: 检验检测认证中心
    template-code: SMS_CERT_EXPIRE_REMIND
  default-contacts:
    email: contact@iccert.gov.cn
    phone: 400-888-8888

minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iccert-report

springdoc:
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
