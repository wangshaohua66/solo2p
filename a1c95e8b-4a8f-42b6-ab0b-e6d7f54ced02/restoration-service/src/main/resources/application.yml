server:
  port: 9600

spring:
  application:
    name: restoration-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: heritage_restoration
      username:
      password:
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

restoration:
  default-supervisor: admin
  max-photos-per-item: 200
  auto-progress-enable: true

logging:
  level:
    com.heritage.restoration: DEBUG
