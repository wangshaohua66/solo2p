server:
  port: 9600

spring:
  application:
    name: restoration-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/heritage_restoration}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:eureka123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

restoration:
  default-supervisor: admin
  max-photos-per-item: 200
  auto-progress-enable: true

logging:
  level:
    com.heritage.restoration: INFO
