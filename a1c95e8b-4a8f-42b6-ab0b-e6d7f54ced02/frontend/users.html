<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 文化遗产数字化保护平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main-content">
    <div class="topbar" id="topbar-root"></div>
    <div class="page-content">
      <div class="stats-grid" style="grid-template-columns:repeat(5,1fr);">
        <div class="stat-card"><div class="stat-icon primary">👥</div><div class="stat-info"><h3 id="u-total">-</h3><p>用户总数</p></div></div>
        <div class="stat-card"><div class="stat-icon purple">🛡️</div><div class="stat-info"><h3 id="u-admin">-</h3><p>管理员</p></div></div>
        <div class="stat-card"><div class="stat-icon info">🔬</div><div class="stat-info"><h3 id="u-expert">-</h3><p>专家</p></div></div>
        <div class="stat-card"><div class="stat-icon warning">🔧</div><div class="stat-info"><h3 id="u-restorer">-</h3><p>修复师</p></div></div>
        <div class="stat-card"><div class="stat-icon success">📋</div><div class="stat-info"><h3 id="u-inspector">-</h3><p>巡查员</p></div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h5>👤 用户列表</h5>
          <div>
            <div class="filter-item" style="display:inline-flex;flex-direction:row;gap:8px;align-items:center;">
              <input type="text" class="form-control form-control-sm" id="f-kw" placeholder="搜索用户名/姓名" style="height:34px;min-width:200px;">
              <select class="form-select form-select-sm" id="f-role" style="height:34px;">
                <option value="">全部角色</option>
                <option value="ADMIN">管理员</option>
                <option value="EXPERT">专家</option>
                <option value="RESTORER">修复师</option>
                <option value="ARCHIVIST">档案员</option>
                <option value="INSPECTOR">巡查员</option>
              </select>
              <button class="btn btn-sm btn-primary" id="btn-search">🔍</button>
              <button class="btn btn-sm btn-success" id="btn-add">+ 新增用户</button>
            </div>
          </div>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table table-hover" style="margin:0;">
              <thead>
                <tr>
                  <th>用户</th>
                  <th>用户名</th>
                  <th>邮箱</th>
                  <th>手机号</th>
                  <th>角色</th>
                  <th>数据权限</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="u-tbody">
                <tr><td colspan="9" style="text-align:center;padding:40px;"><div class="loading-spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div id="pagination" class="p-3 d-flex justify-content-center border-top"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="userModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="um-title">新增用户</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="u-form">
            <input type="hidden" id="u-id">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">用户名 *</label><input type="text" class="form-control" id="u-username" required></div>
              <div class="col-md-6"><label class="form-label">真实姓名 *</label><input type="text" class="form-control" id="u-realname" required></div>
              <div class="col-md-6"><label class="form-label">邮箱</label><input type="email" class="form-control" id="u-email"></div>
              <div class="col-md-6"><label class="form-label">手机号</label><input type="text" class="form-control" id="u-phone"></div>
              <div class="col-md-6" id="pw-box"><label class="form-label">初始密码 *</label><input type="password" class="form-control" id="u-password" placeholder="至少6位"></div>
              <div class="col-md-6">
                <label class="form-label">角色 *</label>
                <select class="form-select" id="u-role" multiple size="5" required>
                  <option value="ADMIN">管理员</option>
                  <option value="EXPERT">专家</option>
                  <option value="RESTORER">修复师</option>
                  <option value="ARCHIVIST">档案员</option>
                  <option value="INSPECTOR">巡查员</option>
                </select>
                <small class="text-muted">可多选，按住 Ctrl/Cmd</small>
              </div>
              <div class="col-md-6">
                <label class="form-label">数据访问级别</label>
                <select class="form-select" id="u-access">
                  <option value="5">5 - 全部级别可见（管理员）</option>
                  <option value="4">4 - 三级以上（专家）</option>
                  <option value="3">3 - 一般文物以上（修复师）</option>
                  <option value="2">2 - 普通以上（档案员）</option>
                  <option value="1">1 - 仅公开数据（巡查员）</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">状态</label>
                <select class="form-select" id="u-active">
                  <option value="true">启用</option>
                  <option value="false">禁用</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary" id="btn-save-user">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    Layout.mount('users');
    const UserPage = {
      page: 0, size: 10,
      async loadStats() {
        try {
          const d = await Api.get('/auth/users?page=0&size=200');
          const list = d.content || d || [];
          const count = role => list.filter(u => (u.roles||[]).includes(role)).length;
          $('#u-total').text(list.length);
          $('#u-admin').text(count('ADMIN'));
          $('#u-expert').text(count('EXPERT'));
          $('#u-restorer').text(count('RESTORER'));
          $('#u-inspector').text(count('INSPECTOR'));
        } catch(e) {}
      },
      async load() {
        const params = new URLSearchParams({
          page: this.page, size: this.size,
          keyword: $('#f-kw').val(),
          role: $('#f-role').val()
        });
        try {
          const d = await Api.get('/auth/users?' + params);
          const items = d.content || d || [];
          if (!items.length) {
            $('#u-tbody').html('<tr><td colspan="9"><div class="empty-state"><i>👤</i><h4>暂无用户</h4></div></td></tr>');
          } else {
            $('#u-tbody').html(items.map(u => `
              <tr>
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="topbar-avatar" style="width:32px;height:32px;font-size:12px;">${(u.realName||u.username||'U')[0]}</div>
                    <div>
                      <div style="font-weight:600;">${Utils.esc(u.realName||'-')}</div>
                      <small style="color:#6c757d;">@${Utils.esc(u.username)}</small>
                    </div>
                  </div>
                </td>
                <td>${Utils.esc(u.username)}</td>
                <td>${Utils.esc(u.email||'-')}</td>
                <td>${Utils.esc(u.phone||'-')}</td>
                <td>${(u.roles||[]).map(r=>`<span class="badge bg-info me-1">${Utils.roleLabel(r)}</span>`).join('')}</td>
                <td>Lv.${u.dataAccessLevel||1}</td>
                <td>${u.active!==false?'<span class="badge bg-success">启用</span>':'<span class="badge bg-secondary">禁用</span>'}</td>
                <td>${Utils.fmtDay(u.createdAt)}</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary" onclick="UserPage.edit('${u.id}')">编辑</button>
                  <button class="btn btn-sm btn-outline-warning" onclick="UserPage.resetPwd('${u.id}','${Utils.esc(u.username)}')">重置密码</button>
                  ${u.username!=='admin'?`<button class="btn btn-sm btn-outline-danger" onclick="UserPage.del('${u.id}','${Utils.esc(u.username)}')">删除</button>`:''}
                </td>
              </tr>
            `).join(''));
          }
          this.renderPagination(d.totalPages||1);
        } catch(e) {
          $('#u-tbody').html('<tr><td colspan="9"><div class="empty-state"><i>❌</i><h4>加载失败</h4></div></td></tr>');
        }
      },
      renderPagination(total) {
        if (total <= 1) { $('#pagination').empty(); return; }
        let html = '<nav><ul class="pagination">';
        html += `<li class="page-item ${this.page===0?'disabled':''}"><a class="page-link" href="javascript:;" onclick="UserPage.go(${this.page-1})">上一页</a></li>`;
        for (let i=Math.max(0,this.page-2); i<=Math.min(total-1,this.page+2); i++) {
          html += `<li class="page-item ${i===this.page?'active':''}"><a class="page-link" href="javascript:;" onclick="UserPage.go(${i})">${i+1}</a></li>`;
        }
        html += `<li class="page-item ${this.page===total-1?'disabled':''}"><a class="page-link" href="javascript:;" onclick="UserPage.go(${this.page+1})">下一页</a></li>`;
        html += '</ul></nav>';
        $('#pagination').html(html);
      },
      go(p) { this.page = Math.max(0, p); this.load(); },
      add() {
        $('#um-title').text('新增用户');
        $('#u-form')[0].reset();
        $('#u-id').val('');
        $('#pw-box').show();
        new bootstrap.Modal(document.getElementById('userModal')).show();
      },
      async edit(id) {
        try {
          const u = await Api.get('/auth/users/' + id);
          $('#um-title').text('编辑用户 - ' + u.username);
          $('#u-id').val(u.id);
          $('#u-username').val(u.username).prop('disabled', true);
          $('#u-realname').val(u.realName||'');
          $('#u-email').val(u.email||'');
          $('#u-phone').val(u.phone||'');
          $('#u-access').val(u.dataAccessLevel||1);
          $('#u-active').val(String(u.active!==false));
          $('#u-role').val(u.roles||[]);
          $('#pw-box').hide();
          new bootstrap.Modal(document.getElementById('userModal')).show();
        } catch(e) {}
      },
      async save() {
        const id = $('#u-id').val();
        const roles = $('#u-role').val();
        if (!roles || !roles.length) { Toast.warning('请至少选择一个角色'); return; }
        const body = {
          realName: $('#u-realname').val().trim(),
          email: $('#u-email').val().trim(),
          phone: $('#u-phone').val().trim(),
          roles,
          dataAccessLevel: parseInt($('#u-access').val()),
          active: $('#u-active').val() === 'true'
        };
        try {
          if (id) {
            await Api.put('/auth/users/' + id, body);
            Toast.success('更新成功');
          } else {
            if (!$('#u-username').val().trim() || !$('#u-password').val()) {
              Toast.warning('请填写用户名和密码'); return;
            }
            await Api.post('/auth/users', {
              username: $('#u-username').val().trim(),
              password: $('#u-password').val(),
              ...body
            });
            Toast.success('创建成功');
          }
          bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
          $('#u-username').prop('disabled', false);
          this.load();
          this.loadStats();
        } catch(e) {}
      },
      async del(id, name) {
        if (!await Utils.confirm(`确定删除用户 "${name}"？此操作不可恢复。`)) return;
        try { await Api.delete('/auth/users/' + id); Toast.success('已删除'); this.load(); this.loadStats(); } catch(e){}
      },
      async resetPwd(id, name) {
        const np = prompt(`为用户 "${name}" 设置新密码（至少6位）：`);
        if (!np || np.length < 6) { Toast.warning('密码长度至少6位'); return; }
        try { await Api.put('/auth/users/' + id + '/reset-password', { newPassword: np }); Toast.success('密码已重置'); } catch(e){}
      }
    };

    $('#btn-add').on('click', () => UserPage.add());
    $('#btn-search').on('click', () => { UserPage.page = 0; UserPage.load(); });
    $('#btn-save-user').on('click', () => UserPage.save());
    $('#f-kw').on('keypress', e => { if (e.which===13) { UserPage.page=0; UserPage.load(); } });

    UserPage.loadStats();
    UserPage.load();
  </script>
</body>
</html>
