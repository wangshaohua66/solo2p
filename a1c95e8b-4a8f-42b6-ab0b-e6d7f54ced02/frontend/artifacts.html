<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文物档案 - 文化遗产数字化保护平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main-content">
    <div class="topbar" id="topbar-root"></div>
    <div class="page-content">
      <div class="filter-bar">
        <div class="filter-item">
          <label>关键词</label>
          <input type="text" class="form-control" id="f-keyword" placeholder="名称/编号/描述">
        </div>
        <div class="filter-item">
          <label>类型</label>
          <select class="form-select" id="f-type">
            <option value="">全部</option>
            <option>PAINTING</option><option>CALLIGRAPHY</option><option>SCULPTURE</option>
            <option>CERAMIC</option><option>JADE</option><option>BRONZE</option>
            <option>METAL</option><option>TEXTILE</option><option>FURNITURE</option>
            <option>DOCUMENT</option><option>COIN</option><option>ARCHITECTURE</option>
            <option>STONE_CARVING</option><option>MURAL</option><option>OTHER</option>
          </select>
        </div>
        <div class="filter-item">
          <label>级别</label>
          <select class="form-select" id="f-level">
            <option value="">全部</option>
            <option value="NATIONAL_FIRST">国家一级</option>
            <option value="NATIONAL_SECOND">国家二级</option>
            <option value="NATIONAL_THIRD">国家三级</option>
            <option value="GENERAL">一般文物</option>
            <option value="ORDINARY">普通文物</option>
          </select>
        </div>
        <div class="filter-item">
          <label>状态</label>
          <select class="form-select" id="f-status">
            <option value="">全部</option>
            <option value="IN_LIBRARY">在库</option>
            <option value="ON_EXHIBITION">展出</option>
            <option value="RESTORING">修复中</option>
            <option value="LENT_OUT">外借</option>
            <option value="DAMAGED">损坏</option>
            <option value="LOST">遗失</option>
          </select>
        </div>
        <div class="filter-item">
          <label>朝代</label>
          <input type="text" class="form-control" id="f-dynasty" placeholder="如：唐代">
        </div>
        <div class="filter-item">
          <button class="btn btn-primary" id="btn-search">🔍 搜索</button>
          <button class="btn btn-outline-secondary" id="btn-reset">重置</button>
        </div>
        <div class="filter-item" style="margin-left:auto;">
          <button class="btn btn-success" id="btn-add" style="height:38px;">+ 新增文物</button>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <div class="col"><span style="font-size:13px;color:#6c757d;" id="total-info">共 0 件文物</span></div>
      </div>

      <div id="artifact-grid" class="artifact-grid"></div>

      <div id="pagination" class="mt-4 d-flex justify-content-center"></div>
    </div>
  </div>

  <div class="modal fade" id="artifactModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">新增文物</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="artifactForm">
            <input type="hidden" id="f-id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">文物名称 *</label>
                <input type="text" class="form-control" id="f-name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">文物类型 *</label>
                <select class="form-select" id="f-artifactType" required>
                  <option value="">请选择</option>
                  <option>PAINTING</option><option>CALLIGRAPHY</option><option>SCULPTURE</option>
                  <option>CERAMIC</option><option>JADE</option><option>BRONZE</option>
                  <option>METAL</option><option>TEXTILE</option><option>FURNITURE</option>
                  <option>DOCUMENT</option><option>COIN</option><option>ARCHITECTURE</option>
                  <option>STONE_CARVING</option><option>MURAL</option><option>OTHER</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">文物级别 *</label>
                <select class="form-select" id="f-level2" required>
                  <option value="">请选择</option>
                  <option value="NATIONAL_FIRST">国家一级</option>
                  <option value="NATIONAL_SECOND">国家二级</option>
                  <option value="NATIONAL_THIRD">国家三级</option>
                  <option value="GENERAL">一般文物</option>
                  <option value="ORDINARY">普通文物</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">朝代/年代</label>
                <input type="text" class="form-control" id="f-dynasty2">
              </div>
              <div class="col-md-6">
                <label class="form-label">出土地点/来源</label>
                <input type="text" class="form-control" id="f-origin">
              </div>
              <div class="col-md-6">
                <label class="form-label">尺寸规格</label>
                <input type="text" class="form-control" id="f-size" placeholder="如：高30cm 宽20cm">
              </div>
              <div class="col-md-6">
                <label class="form-label">材质</label>
                <input type="text" class="form-control" id="f-material">
              </div>
              <div class="col-md-6">
                <label class="form-label">保存状态</label>
                <select class="form-select" id="f-status2">
                  <option value="IN_LIBRARY">在库</option>
                  <option value="ON_EXHIBITION">展出</option>
                  <option value="RESTORING">修复中</option>
                  <option value="LENT_OUT">外借</option>
                  <option value="DAMAGED">损坏</option>
                  <option value="LOST">遗失</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">文物描述</label>
                <textarea class="form-control" id="f-description" rows="3"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">文物图片</label>
                <input type="file" class="form-control" id="f-images" accept="image/*" multiple>
                <small class="text-muted">可上传多张图片，单个文物最多500张</small>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    Layout.mount('artifact');
    const ArtifactPage = {
      page: 0, size: 12,
      levelBadge(l) {
        const m = { NATIONAL_FIRST:1, NATIONAL_SECOND:2, NATIONAL_THIRD:3, GENERAL:4, ORDINARY:5 };
        return m[l] || 5;
      },
      statusCls(s) {
        const m = { IN_LIBRARY:'status-inlibrary', RESTORING:'status-restoring',
          ON_EXHIBITION:'status-exhibit', LENT_OUT:'status-lending',
          LOST:'status-lost', DAMAGED:'status-damaged' };
        return m[s] || '';
      },
      async load() {
        const params = new URLSearchParams({
          page: this.page, size: this.size,
          keyword: $('#f-keyword').val() || '',
          type: $('#f-type').val() || '',
          level: $('#f-level').val() || '',
          status: $('#f-status').val() || '',
          dynasty: $('#f-dynasty').val() || ''
        }).toString();
        try {
          const d = await Api.get('/artifact/search?' + params);
          const items = d.content || [];
          $('#total-info').text(`共 ${d.totalElements||0} 件文物`);
          if (!items.length) {
            $('#artifact-grid').html('<div class="empty-state" style="grid-column:1/-1;"><i>🏺</i><h4>暂无文物数据</h4><p>请点击右上角"新增文物"添加</p></div>');
          } else {
            $('#artifact-grid').html(items.map(a => {
              const img = (a.images && a.images[0]) ? `<img src="${a.images[0].url || a.images[0].objectUrl || ''}" onerror="this.style.display=\'none\'">` : '🏺';
              return `
                <div class="artifact-card" onclick="location.href='artifact-detail.html?id=${a.id}'">
                  <div class="artifact-image">
                    ${img}
                    <span class="artifact-badge badge-level-${this.levelBadge(a.level)}">${Utils.levelLabel(a.level)}</span>
                  </div>
                  <div class="artifact-info">
                    <div class="artifact-code">${Utils.esc(a.artifactCode||'')}</div>
                    <h5 class="artifact-name">${Utils.esc(a.name)}</h5>
                    <div class="artifact-meta">
                      <span>${Utils.typeLabel(a.type)}</span>
                      <span>${Utils.esc(a.dynasty||'-')}</span>
                      <span class="status-badge ${this.statusCls(a.status)}">${Utils.statusLabel(a.status)}</span>
                    </div>
                  </div>
                </div>
              `;
            }).join(''));
          }
          this.renderPagination(d.totalPages||1);
        } catch(e) {}
      },
      renderPagination(total) {
        if (total <= 1) { $('#pagination').empty(); return; }
        let html = '<nav><ul class="pagination">';
        html += `<li class="page-item ${this.page===0?'disabled':''}"><a class="page-link" href="javascript:;" onclick="ArtifactPage.go(${this.page-1})">上一页</a></li>`;
        const start = Math.max(0, this.page-2), end = Math.min(total-1, this.page+2);
        for (let i=start; i<=end; i++) {
          html += `<li class="page-item ${i===this.page?'active':''}"><a class="page-link" href="javascript:;" onclick="ArtifactPage.go(${i})">${i+1}</a></li>`;
        }
        html += `<li class="page-item ${this.page===total-1?'disabled':''}"><a class="page-link" href="javascript:;" onclick="ArtifactPage.go(${this.page+1})">下一页</a></li>`;
        html += '</ul></nav>';
        $('#pagination').html(html);
      },
      go(p) { this.page = Math.max(0, p); this.load(); },
      async save() {
        const id = $('#f-id').val();
        const body = {
          name: $('#f-name').val().trim(),
          type: $('#f-artifactType').val(),
          level: $('#f-level2').val(),
          dynasty: $('#f-dynasty2').val().trim(),
          origin: $('#f-origin').val().trim(),
          size: $('#f-size').val().trim(),
          material: $('#f-material').val().trim(),
          status: $('#f-status2').val(),
          description: $('#f-description').val().trim()
        };
        try {
          let saved;
          if (id) {
            saved = await Api.put('/artifact/' + id, body);
          } else {
            saved = await Api.post('/artifact', body);
          }
          const files = $('#f-images')[0].files;
          if (files && files.length) {
            for (const f of files) {
              const fd = new FormData();
              fd.append('file', f);
              try { await Api.upload(`/artifact/${saved.id}/images`, fd); } catch(e){}
            }
          }
          Toast.success(id ? '更新成功' : '创建成功');
          bootstrap.Modal.getInstance(document.getElementById('artifactModal')).hide();
          this.load();
        } catch(e) {}
      }
    };

    $('#btn-search').on('click', () => { ArtifactPage.page = 0; ArtifactPage.load(); });
    $('#btn-reset').on('click', () => {
      $('#f-keyword,#f-dynasty').val('');
      $('#f-type,#f-level,#f-status').val('');
      ArtifactPage.page = 0; ArtifactPage.load();
    });
    $('#btn-add').on('click', () => {
      $('#modalTitle').text('新增文物');
      $('#artifactForm')[0].reset();
      $('#f-id').val('');
      new bootstrap.Modal(document.getElementById('artifactModal')).show();
    });
    $('#btn-save').on('click', () => ArtifactPage.save());
    ArtifactPage.load();
  </script>
</body>
</html>
