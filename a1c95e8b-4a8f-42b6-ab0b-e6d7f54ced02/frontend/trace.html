<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修复溯源 - 文化遗产数字化保护平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main-content">
    <div class="topbar" id="topbar-root"></div>
    <div class="page-content">
      <div class="filter-bar">
        <div class="filter-item">
          <label>文物编号/名称</label>
          <input type="text" class="form-control" id="f-keyword" placeholder="搜索文物">
        </div>
        <div class="filter-item">
          <label>流转类型</label>
          <select class="form-select" id="f-type">
            <option value="">全部</option>
            <option>OUTBOUND</option><option>SENT_FOR_RESTORE</option><option>START_RESTORE</option>
            <option>RESTORE_COMPLETE</option><option>INBOUND</option><option>LEND</option>
            <option>RETURN</option><option>EXHIBIT</option><option>EXHIBIT_END</option>
            <option>DAMAGE</option><option>INSPECT</option><option>OTHER</option>
          </select>
        </div>
        <div class="filter-item">
          <label>时间范围</label>
          <input type="date" class="form-control" id="f-start">
        </div>
        <div class="filter-item" style="justify-content:flex-end;">
          <label>&nbsp;</label>
          <button class="btn btn-primary" id="btn-search">🔍 查询</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h5>📋 文物流转记录（区块链存证）</h5>
          <span style="font-size:12px;color:#6c757d;">每次流转自动生成哈希存证，数据不可篡改</span>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table table-hover" style="margin:0;">
              <thead>
                <tr>
                  <th>文物信息</th>
                  <th>流转类型</th>
                  <th>操作人/单位</th>
                  <th>操作时间</th>
                  <th>存证哈希</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="trace-tbody">
                <tr><td colspan="6" style="text-align:center;padding:40px;color:#6c757d;"><div class="loading-spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div id="pagination" class="p-3 d-flex justify-content-center border-top"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    Layout.mount('trace');
    const TracePage = {
      page: 0, size: 15,
      async load() {
        const params = new URLSearchParams({
          page: this.page, size: this.size,
          keyword: $('#f-keyword').val(),
          flowType: $('#f-type').val(),
          startTime: $('#f-start').val()
        });
        try {
          const d = await Api.get('/trace/records?' + params.toString());
          const items = d.content || [];
          if (!items.length) {
            $('#trace-tbody').html('<tr><td colspan="6"><div class="empty-state"><i>📭</i><h4>暂无流转记录</h4></div></td></tr>');
          } else {
            $('#trace-tbody').html(items.map(r => `
              <tr>
                <td>
                  <div style="font-weight:600;">${Utils.esc(r.artifactName||'-')}</div>
                  <div style="font-size:11px;color:#6c757d;font-family:monospace;">${Utils.esc(r.artifactCode||'')}</div>
                </td>
                <td><span class="badge bg-${this.typeColor(r.flowType)}" style="padding:6px 10px;">${Utils.flowLabel(r.flowType)}</span></td>
                <td>${Utils.esc(r.operatorName||r.operatorId||'-')}</td>
                <td>${Utils.fmtDate(r.createdAt)}</td>
                <td><code style="font-size:11px;background:#f5f0e8;padding:4px 8px;border-radius:4px;" title="${Utils.esc(r.blockchainHash)}">${Utils.maskHash(r.blockchainHash)}</code></td>
                <td>
                  <button class="btn btn-sm btn-outline-primary" onclick="TracePage.view('${r.artifactId}')">详情</button>
                </td>
              </tr>
            `).join(''));
          }
          this.renderPagination(d.totalPages||1);
        } catch(e) {
          $('#trace-tbody').html('<tr><td colspan="6"><div class="empty-state"><i>❌</i><h4>加载失败</h4></div></td></tr>');
        }
      },
      typeColor(t) {
        const m = { INBOUND:'success', RESTORE_COMPLETE:'success', OUTBOUND:'info',
          SENT_FOR_RESTORE:'warning', START_RESTORE:'warning', EXHIBIT:'info',
          LEND:'secondary', DAMAGE:'danger' };
        return m[t] || 'secondary';
      },
      renderPagination(total) {
        if (total <= 1) { $('#pagination').empty(); return; }
        let html = '<nav><ul class="pagination">';
        html += `<li class="page-item ${this.page===0?'disabled':''}"><a class="page-link" href="javascript:;" onclick="TracePage.go(${this.page-1})">上一页</a></li>`;
        for (let i=Math.max(0,this.page-2); i<=Math.min(total-1,this.page+2); i++) {
          html += `<li class="page-item ${i===this.page?'active':''}"><a class="page-link" href="javascript:;" onclick="TracePage.go(${i})">${i+1}</a></li>`;
        }
        html += `<li class="page-item ${this.page===total-1?'disabled':''}"><a class="page-link" href="javascript:;" onclick="TracePage.go(${this.page+1})">下一页</a></li>`;
        html += '</ul></nav>';
        $('#pagination').html(html);
      },
      go(p) { this.page = Math.max(0, p); this.load(); },
      view(artifactId) {
        location.href = 'artifact-detail.html?id=' + artifactId + '#trace';
      }
    };
    $('#btn-search').on('click', () => { TracePage.page = 0; TracePage.load(); });
    TracePage.load();
  </script>
</body>
</html>
