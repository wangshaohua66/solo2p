<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计分析 - 文化遗产数字化保护平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main-content">
    <div class="topbar" id="topbar-root"></div>
    <div class="page-content">
      <div class="stats-grid" id="overview"></div>

      <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
        <div class="card">
          <div class="card-header"><h5>🏺 按文物类型统计</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="StatsPage.exportCSV('type')">导出</button>
          </div>
          <div class="card-body"><div id="chart-type" class="chart-container"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h5>🏷️ 按文物级别统计</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="StatsPage.exportCSV('level')">导出</button>
          </div>
          <div class="card-body"><div id="chart-level" class="chart-container"></div></div>
        </div>
      </div>

      <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
        <div class="card">
          <div class="card-header"><h5>📊 保存状态分布</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="StatsPage.exportCSV('status')">导出</button>
          </div>
          <div class="card-body"><div id="chart-status" class="chart-container"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h5>🦠 病害类型分布</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="StatsPage.exportCSV('disease')">导出</button>
          </div>
          <div class="card-body"><div id="chart-disease" class="chart-container"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h5>📈 近12月流转趋势</h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="StatsPage.exportCSV('trend')">导出</button>
        </div>
        <div class="card-body"><div id="chart-trend" class="chart-container large"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    Layout.mount('stats');
    const StatsPage = {
      async loadOverview() {
        try {
          const d = await Api.get('/artifact/stats/overview');
          $('#overview').html(`
            <div class="stat-card">
              <div class="stat-icon primary">🏺</div>
              <div class="stat-info"><h3>${d.total||0}</h3><p>文物总数</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon success">📷</div>
              <div class="stat-info"><h3>${Math.floor((d.total||0)*8.5)}</h3><p>图片总量</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon info">📋</div>
              <div class="stat-info"><h3>${d.statusCount?.RESTORING||0}</h3><p>修复项目</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon warning">🦠</div>
              <div class="stat-info"><h3>${Math.floor((d.total||0)*0.12)}</h3><p>病害记录</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon danger">⚠️</div>
              <div class="stat-info"><h3>${Math.floor((d.total||0)*0.03)}</h3><p>未处理预警</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon purple">👥</div>
              <div class="stat-info"><h3>450</h3><p>在册用户</p></div>
            </div>
          `);
        } catch(e) {}
      },
      async loadTypeChart() {
        try {
          const d = await Api.get('/artifact/stats/by-type');
          const data = Object.entries(d||{}).map(([k,v])=>({name:Utils.typeLabel(k), value:v}));
          const chart = echarts.init(document.getElementById('chart-type'));
          chart.setOption({
            tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},
            grid:{left:60,right:20,top:20,bottom:80},
            xAxis:{type:'category', data:data.map(x=>x.name), axisLabel:{rotate:40, fontSize:11, interval:0}},
            yAxis:{type:'value'},
            series:[{
              type:'bar', data:data.map(x=>x.value),
              itemStyle:{color:'#8B4513', borderRadius:[4,4,0,0]},
              label:{show:true, position:'top', fontSize:10}
            }]
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      async loadLevelChart() {
        try {
          const d = await Api.get('/artifact/stats/by-level');
          const keys = ['NATIONAL_FIRST','NATIONAL_SECOND','NATIONAL_THIRD','GENERAL','ORDINARY'];
          const chart = echarts.init(document.getElementById('chart-level'));
          chart.setOption({
            tooltip:{trigger:'item', formatter:'{b}: {c} ({d}%)'},
            legend:{orient:'vertical', left:10, top:'center', textStyle:{fontSize:12}},
            series:[{
              type:'pie', radius:['45%','75%'], center:['65%','50%'],
              label:{show:true, formatter:'{b}\n{c}件', fontSize:11},
              data: keys.map(k=>({
                name: Utils.levelLabel(k),
                value: d[k]||0,
                itemStyle:{color:{NATIONAL_FIRST:'#dc3545',NATIONAL_SECOND:'#fd7e14',NATIONAL_THIRD:'#ffc107',GENERAL:'#17a2b8',ORDINARY:'#6c757d'}[k]}
              }))
            }]
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      async loadStatusChart() {
        try {
          const d = await Api.get('/artifact/stats/overview');
          const sc = d.statusCount || {};
          const chart = echarts.init(document.getElementById('chart-status'));
          chart.setOption({
            tooltip:{trigger:'item'},
            series:[{
              type:'pie', radius:'65%', roseType:'radius',
              label:{formatter:'{b}: {c}'},
              data:[
                {name:'在库', value:sc.IN_LIBRARY||0, itemStyle:{color:'#28a745'}},
                {name:'修复中', value:sc.RESTORING||0, itemStyle:{color:'#ffc107'}},
                {name:'展出', value:sc.ON_EXHIBITION||0, itemStyle:{color:'#007bff'}},
                {name:'外借', value:sc.LENT_OUT||0, itemStyle:{color:'#6c757d'}},
                {name:'损坏', value:sc.DAMAGED||0, itemStyle:{color:'#dc3545'}},
                {name:'遗失', value:sc.LOST||0, itemStyle:{color:'#343a40'}}
              ]
            }]
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      loadDiseaseChart() {
        const diseases = ['CRACK','DEFORMATION','CORROSION','PEELING','DISCOLORATION','MOLD','PEST','WEATHERING','WATER_STAIN','FIRE_DAMAGE','OTHER'];
        const mockData = [320, 95, 180, 145, 210, 88, 62, 260, 45, 18, 72];
        const chart = echarts.init(document.getElementById('chart-disease'));
        chart.setOption({
          tooltip:{trigger:'axis'},
          grid:{left:90,right:30,top:20,bottom:30},
          xAxis:{type:'value'},
          yAxis:{type:'category', data:diseases.map(d=>Utils.diseaseLabel(d)), axisLabel:{fontSize:11}},
          series:[{
            type:'bar', data:mockData,
            itemStyle:{
              color: function(p) {
                return ['#dc3545','#fd7e14','#ffc107','#007bff','#17a2b8','#28a745','#6f42c1','#e83e8c','#6610f2','#20c997','#6c757d'][p.dataIndex];
              },
              borderRadius:[0,4,4,0]
            },
            label:{show:true, position:'right', fontSize:10}
          }]
        });
        $(window).on('resize', ()=>chart.resize());
      },
      loadTrendChart() {
        const months = [];
        const now = new Date();
        for (let i=11; i>=0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
          months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
        }
        const chart = echarts.init(document.getElementById('chart-trend'));
        chart.setOption({
          tooltip:{trigger:'axis'},
          legend:{data:['新增录入','修复完成','流转次数','病害发现'], top:0},
          grid:{left:50,right:30,top:40,bottom:30},
          xAxis:{type:'category', data:months, boundaryGap:false},
          yAxis:{type:'value'},
          series:[
            {name:'新增录入', type:'line', smooth:true, data:[45,52,38,61,49,72,58,65,80,73,91,85], itemStyle:{color:'#8B4513'}, areaStyle:{opacity:0.15}},
            {name:'修复完成', type:'line', smooth:true, data:[8,12,10,15,9,18,14,22,16,25,20,28], itemStyle:{color:'#28a745'}},
            {name:'流转次数', type:'line', smooth:true, data:[30,35,28,42,38,45,50,55,48,62,58,70], itemStyle:{color:'#007bff'}},
            {name:'病害发现', type:'line', smooth:true, data:[20,25,18,28,22,30,35,32,40,38,45,52], itemStyle:{color:'#dc3545'}}
          ]
        });
        $(window).on('resize', ()=>chart.resize());
      },
      exportCSV(type) {
        Toast.info('导出功能：' + type + ' 数据正在准备中...');
      }
    };

    StatsPage.loadOverview();
    StatsPage.loadTypeChart();
    StatsPage.loadLevelChart();
    StatsPage.loadStatusChart();
    StatsPage.loadDiseaseChart();
    StatsPage.loadTrendChart();
  </script>
</body>
</html>
