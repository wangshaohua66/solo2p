<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - 文化遗产数字化保护平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main-content">
    <div class="topbar" id="topbar-root"></div>
    <div class="page-content">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="row g-20" style="display:grid;grid-template-columns:2fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-header">
            <h5>📊 文物类型分布</h5>
            <div>
              <button class="btn btn-sm btn-outline-secondary" onclick="Stats.exportCSV('type')">导出</button>
            </div>
          </div>
          <div class="card-body">
            <div id="chart-type" class="chart-container large"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h5>⚡ 最近流转</h5></div>
          <div class="card-body" style="padding:0;">
            <div id="recent-trace" style="max-height:360px;overflow-y:auto;"></div>
          </div>
        </div>
      </div>
      <div class="row mt-20" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:0;">
        <div class="card">
          <div class="card-header"><h5>🏷️ 文物级别分布</h5></div>
          <div class="card-body"><div id="chart-level" class="chart-container"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h5>📈 修复状态</h5></div>
          <div class="card-body"><div id="chart-status" class="chart-container"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    Layout.mount('dashboard');

    const Stats = {
      async loadOverview() {
        try {
          const d = await Api.get('/artifact/stats/overview');
          $('#stats-grid').html(`
            <div class="stat-card">
              <div class="stat-icon primary">🏺</div>
              <div class="stat-info"><h3>${d.total||0}</h3><p>文物总数</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon success">✅</div>
              <div class="stat-info"><h3>${d.statusCount?.IN_LIBRARY||0}</h3><p>在库文物</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon warning">🔧</div>
              <div class="stat-info"><h3>${d.statusCount?.RESTORING||0}</h3><p>修复中文物</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon info">🖼️</div>
              <div class="stat-info"><h3>${d.statusCount?.ON_EXHIBITION||0}</h3><p>展出文物</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon danger">⚠️</div>
              <div class="stat-info"><h3>${d.statusCount?.DAMAGED||0}</h3><p>损坏文物</p></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon purple">📋</div>
              <div class="stat-info"><h3>${d.statusCount?.LENT_OUT||0}</h3><p>外借文物</p></div>
            </div>
          `);
        } catch(e) {
          $('#stats-grid').html('<div class="alert alert-warning">统计数据加载失败</div>');
        }
      },
      async loadTypeChart() {
        try {
          const d = await Api.get('/artifact/stats/by-type');
          const data = Object.entries(d||{}).map(([k,v])=>({name:Utils.typeLabel(k), value:v}));
          const chart = echarts.init(document.getElementById('chart-type'));
          chart.setOption({
            tooltip:{trigger:'item', formatter:'{b}: {c} ({d}%)'},
            legend:{orient:'vertical', right:10, top:'center', textStyle:{fontSize:12}},
            series:[{
              type:'pie', radius:['40%','70%'], center:['35%','50%'],
              avoidLabelOverlap:true,
              label:{show:true, formatter:'{b}\n{d}%', fontSize:11},
              data
            }],
            color:['#8B4513','#D4AF37','#17a2b8','#28a745','#fd7e14','#6f42c1','#dc3545','#20c997','#e83e8c','#6610f2','#007bff','#ffc107','#6c757d','#1a1a2e','#5a3921']
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      async loadLevelChart() {
        try {
          const d = await Api.get('/artifact/stats/by-level');
          const keys = ['NATIONAL_FIRST','NATIONAL_SECOND','NATIONAL_THIRD','GENERAL','ORDINARY'];
          const chart = echarts.init(document.getElementById('chart-level'));
          chart.setOption({
            tooltip:{trigger:'axis'},
            grid:{left:60,right:20,top:30,bottom:40},
            xAxis:{type:'category', data:keys.map(k=>Utils.levelLabel(k)), axisLabel:{fontSize:11,interval:0}},
            yAxis:{type:'value'},
            series:[{
              type:'bar', data:keys.map(k=>d[k]||0),
              itemStyle:{color:['#dc3545','#fd7e14','#ffc107','#17a2b8','#6c757d'], borderRadius:[6,6,0,0]},
              label:{show:true, position:'top', fontSize:11}
            }]
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      async loadStatusChart() {
        try {
          const d = await Api.get('/artifact/stats/overview');
          const sc = d.statusCount || {};
          const chart = echarts.init(document.getElementById('chart-status'));
          chart.setOption({
            tooltip:{trigger:'item'},
            series:[{
              type:'pie', radius:'65%',
              label:{formatter:'{b}: {c}'},
              data:[
                {name:'在库', value:sc.IN_LIBRARY||0, itemStyle:{color:'#28a745'}},
                {name:'修复中', value:sc.RESTORING||0, itemStyle:{color:'#ffc107'}},
                {name:'展出', value:sc.ON_EXHIBITION||0, itemStyle:{color:'#007bff'}},
                {name:'外借', value:sc.LENT_OUT||0, itemStyle:{color:'#6c757d'}},
                {name:'损坏', value:sc.DAMAGED||0, itemStyle:{color:'#dc3545'}},
                {name:'遗失', value:sc.LOST||0, itemStyle:{color:'#000'}}
              ]
            }]
          });
          $(window).on('resize', ()=>chart.resize());
        } catch(e) {}
      },
      async loadRecentTrace() {
        try {
          const list = await Api.get('/trace/records?page=0&size=8');
          const items = list.content || [];
          if (!items.length) {
            $('#recent-trace').html('<div class="empty-state"><i>📭</i><h4>暂无流转记录</h4></div>');
            return;
          }
          $('#recent-trace').html(items.map(r=>`
            <div style="padding:12px 16px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center;">
              <div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#8B4513,#D4AF37);display:flex;align-items:center;justify-content:center;color:white;font-size:16px;flex-shrink:0;">📦</div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:600;color:#2c2c2c;">${Utils.flowLabel(r.flowType)}</div>
                <div style="font-size:11px;color:#6c757d;margin-top:2px;">${Utils.esc(r.artifactName||r.artifactCode)} · ${Utils.fmtDate(r.createdAt)}</div>
              </div>
              <div style="font-size:11px;color:#8B4513;font-family:monospace;">${Utils.maskHash(r.blockchainHash)}</div>
            </div>
          `).join(''));
        } catch(e) {
          $('#recent-trace').html('<div class="empty-state"><i>⚠️</i><h4>加载失败</h4></div>');
        }
      },
      exportCSV(type) {
        Toast.info('导出功能开发中...');
      }
    };

    Stats.loadOverview();
    Stats.loadTypeChart();
    Stats.loadLevelChart();
    Stats.loadStatusChart();
    Stats.loadRecentTrace();
  </script>
</body>
</html>
