spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 1GB

jwt:
  secret: heritage-platform-jwt-secret-key-2024-very-long-and-secure-key-for-signing
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: heritage-bucket

es:
  enabled: true
  uris: ${ES_HOST:localhost}:9200
  username: elastic
  password: elastic123

rate-limit:
  global-qps: 5000
  artifact-search-qps: 500

feature-flags:
  ai-recognition: true
  canvas-annotation: true
  trace-blockchain: true

logging:
  level:
    com.heritage: DEBUG
