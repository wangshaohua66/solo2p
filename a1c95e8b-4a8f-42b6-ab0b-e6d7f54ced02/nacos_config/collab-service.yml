server:
  port: 9400

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017/heritage_collab
      auto-index-creation: true

collab:
  annotation:
    enable-canvas: true
    max-annotations-per-image: 500
    undo-redo-stack-size: 100
    supported-tools: rectangle,circle,ellipse,arrow,freehand,measure,text
  expert-pool:
    max-concurrent-tasks: 10
