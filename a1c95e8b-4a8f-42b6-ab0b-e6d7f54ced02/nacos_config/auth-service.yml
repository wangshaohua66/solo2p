server:
  port: 9100

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017/heritage_auth
      auto-index-creation: true

auth:
  default-admin:
    username: admin
    password: admin123
  password-strength: medium
  max-login-attempts: 5
  lock-minutes: 30
  token-refresh-threshold: 1800000
