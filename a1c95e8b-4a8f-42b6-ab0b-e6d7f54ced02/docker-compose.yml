version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: heritage-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: heritage
      MONGO_INITDB_ROOT_PASSWORD: heritage123
    volumes:
      - mongodb_data:/data/db
    networks:
      - heritage-net
    command: --wiredTigerCacheSizeGB 1.5

  minio:
    image: minio/minio:latest
    container_name: heritage-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - heritage-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2-alpine
    container_name: heritage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - heritage-net

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: heritage-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_USERNAME=eureka
      - EUREKA_PASSWORD=eureka123
    networks:
      - heritage-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://eureka:eureka123@localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: heritage-gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - JWT_SECRET=heritage-platform-jwt-secret-key-2024-very-long-and-secure
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - heritage-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: heritage-auth
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - MONGODB_URI=mongodb://heritage:heritage123@mongodb:27017/heritage_auth?authSource=admin
      - JWT_SECRET=heritage-platform-jwt-secret-key-2024-very-long-and-secure
      - JWT_EXPIRATION=86400000
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - heritage-net

  artifact-service:
    build:
      context: ./artifact-service
      dockerfile: Dockerfile
    container_name: heritage-artifact
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - MONGODB_URI=mongodb://heritage:heritage123@mongodb:27017/heritage_artifact?authSource=admin
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=heritage-artifact
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - heritage-net

  trace-service:
    build:
      context: ./trace-service
      dockerfile: Dockerfile
    container_name: heritage-trace
    restart: unless-stopped
    ports:
      - "9300:9300"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - MONGODB_URI=mongodb://heritage:heritage123@mongodb:27017/heritage_trace?authSource=admin
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - heritage-net

  collab-service:
    build:
      context: ./collab-service
      dockerfile: Dockerfile
    container_name: heritage-collab
    restart: unless-stopped
    ports:
      - "9400:9400"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - MONGODB_URI=mongodb://heritage:heritage123@mongodb:27017/heritage_collab?authSource=admin
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - heritage-net

  inspect-service:
    build:
      context: ./inspect-service
      dockerfile: Dockerfile
    container_name: heritage-inspect
    restart: unless-stopped
    ports:
      - "9500:9500"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URI=http://eureka:eureka123@eureka-server:8761/eureka
      - MONGODB_URI=mongodb://heritage:heritage123@mongodb:27017/heritage_inspect?authSource=admin
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=heritage-inspect
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - heritage-net

  frontend:
    image: nginx:1.25-alpine
    container_name: heritage-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service
    networks:
      - heritage-net

volumes:
  mongodb_data:
  minio_data:
  redis_data:

networks:
  heritage-net:
    driver: bridge
