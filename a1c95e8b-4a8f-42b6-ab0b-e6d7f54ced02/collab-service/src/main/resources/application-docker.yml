server:
  port: 9400

spring:
  application:
    name: collab-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/heritage_collab}
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:eureka123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

logging:
  level:
    com.heritage.collab: INFO
