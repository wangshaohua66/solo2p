server:
  port: 9300
spring:
  application:
    name: trace-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: heritage_trace
      auto-index-creation: true
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
logging:
  level:
    com.heritage.trace: DEBUG
