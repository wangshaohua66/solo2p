[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeo"
version = "1.0.0"
description = "考古发掘项目管理系统 - CLI终端应用"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Archaeology Institute", email = "archaeo@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.0.0",
    "openpyxl>=3.0.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "piexif>=1.1.3",
]

[project.scripts]
archaeo = "archaeo.cli:app"

[project.urls]
Homepage = "https://example.com/archaeo"
Issues = "https://example.com/archaeo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["archaeo*"]

[tool.setuptools.package-data]
archaeo = ["templates/*.html"]
