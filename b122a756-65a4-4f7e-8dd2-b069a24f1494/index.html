<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麦香坊烘焙工坊 · 门店营运系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top bakery-topbar">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#/dashboard">
        <i class="bi bi-basket3-fill me-2 fs-3"></i>
        <span class="brand-title">麦香坊</span>
      </a>
      <div class="d-flex align-items-center ms-auto">
        <div class="dropdown me-3">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="storeSwitcher" data-bs-toggle="dropdown">
            <i class="bi bi-shop-window me-1"></i>
            <span id="currentStoreName">总店</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" id="storeList"></ul>
        </div>
        <span class="badge bg-warning text-dark me-3" id="shiftBadge">
          <i class="bi bi-sun me-1"></i>早班
        </span>
        <span class="navbar-text me-3">
          <i class="bi bi-person-circle me-1"></i>
          <span id="currentOperator">店长·王芳</span>
        </span>
        <button class="btn btn-outline-light btn-sm" onclick="App.exportBackup()">
          <i class="bi bi-cloud-download me-1"></i>备份
        </button>
      </div>
    </div>
  </nav>

  <div class="d-flex bakery-body">
    <aside class="sidebar d-none d-lg-block" id="sidebar">
      <ul class="nav flex-column nav-pills" id="sideMenu">
        <li class="nav-item">
          <a class="nav-link" data-route="dashboard" href="#/dashboard">
            <i class="bi bi-speedometer2 me-2"></i><span>仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="schedule" href="#/schedule">
            <i class="bi bi-calendar-week me-2"></i><span>智能排产</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="workorder" href="#/workorder">
            <i class="bi bi-kanban me-2"></i><span>后厨工单</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="pos" href="#/pos">
            <i class="bi bi-cash-coin me-2"></i><span>POS销售</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="transfer" href="#/transfer">
            <i class="bi bi-arrow-left-right me-2"></i><span>跨店调拨</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="member" href="#/member">
            <i class="bi bi-people me-2"></i><span>会员管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="report" href="#/report">
            <i class="bi bi-bar-chart-line me-2"></i><span>报表分析</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-route="backup" href="#/backup">
            <i class="bi bi-database-gear me-2"></i><span>数据备份</span>
          </a>
        </li>
      </ul>
    </aside>

    <nav class="navbar navbar-dark fixed-bottom d-lg-none bakery-bottombar">
      <div class="container-fluid">
        <div class="bottombar-row">
          <a class="nav-link" data-route="dashboard" href="#/dashboard"><i class="bi bi-speedometer2"></i><small>仪表盘</small></a>
          <a class="nav-link" data-route="schedule" href="#/schedule"><i class="bi bi-calendar-week"></i><small>排产</small></a>
          <a class="nav-link" data-route="workorder" href="#/workorder"><i class="bi bi-kanban"></i><small>工单</small></a>
          <a class="nav-link" data-route="pos" href="#/pos"><i class="bi bi-cash-coin"></i><small>POS</small></a>
          <a class="nav-link" data-route="transfer" href="#/transfer"><i class="bi bi-arrow-left-right"></i><small>调拨</small></a>
          <a class="nav-link" data-route="member" href="#/member"><i class="bi bi-people"></i><small>会员</small></a>
          <a class="nav-link" data-route="report" href="#/report"><i class="bi bi-bar-chart-line"></i><small>报表</small></a>
          <a class="nav-link" data-route="backup" href="#/backup"><i class="bi bi-database-gear"></i><small>备份</small></a>
        </div>
      </div>
    </nav>

    <main class="main-content" id="app"></main>
  </div>

  <template id="tpl-dashboard">
    <div class="container-fluid p-4">
      <h3 class="page-title mb-4">今日营运概览 <small class="text-muted" id="dashDate"></small></h3>
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="stat-card stat-sales">
            <div class="stat-label">今日销售额</div>
            <div class="stat-value" id="statSales">¥0</div>
            <div class="stat-trend"><i class="bi bi-arrow-up"></i> 较昨日</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card stat-orders">
            <div class="stat-label">订单数量</div>
            <div class="stat-value" id="statOrders">0</div>
            <div class="stat-trend">客单价 ¥0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card stat-product">
            <div class="stat-label">进行中工单</div>
            <div class="stat-value" id="statWorkorder">0</div>
            <div class="stat-trend">待执行 0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card stat-waste">
            <div class="stat-label">报废率</div>
            <div class="stat-value" id="statWaste">0%</div>
            <div class="stat-trend">目标 ≤ 8%</div>
          </div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white"><h6 class="mb-0">今日品类销售占比</h6></div>
            <div class="card-body"><canvas id="dashCategoryChart" height="220"></canvas></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white"><h6 class="mb-0">近7日销售趋势</h6></div>
            <div class="card-body"><canvas id="dashTrendChart" height="220"></canvas></div>
          </div>
        </div>
      </div>
      <div class="row g-3 mt-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">库存预警</h6>
              <a class="btn btn-sm btn-outline-primary" href="#/report">查看全部</a>
            </div>
            <div class="card-body p-0">
              <table class="table table-hover mb-0" id="lowStockTable">
                <thead><tr><th>产品</th><th>库存</th><th>建议产量</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">快捷操作</h6>
            </div>
            <div class="card-body">
              <div class="d-grid gap-2">
                <a class="btn btn-bakery btn-lg" href="#/schedule">
                  <i class="bi bi-calendar-plus me-2"></i>创建今日排产
                </a>
                <a class="btn btn-outline-bakery btn-lg" href="#/pos">
                  <i class="bi bi-cart-plus me-2"></i>打开POS收银
                </a>
                <a class="btn btn-outline-bakery btn-lg" href="#/workorder">
                  <i class="bi bi-list-task me-2"></i>查看后厨工单
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-schedule">
    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
        <div>
          <h3 class="page-title mb-2">智能排产</h3>
          <div class="d-flex gap-1 flex-wrap" id="weatherTags">
            <span class="weather-tag active" data-weather="sunny">☀️ 晴天</span>
            <span class="weather-tag" data-weather="cloudy">⛅ 多云</span>
            <span class="weather-tag" data-weather="rainy">🌧️ 雨天</span>
            <span class="weather-tag" data-weather="snowy">❄️ 雪天</span>
            <span class="weather-tag" data-weather="weekend">📅 周末</span>
            <span class="weather-tag" data-weather="holiday">🎊 节假日</span>
          </div>
          <div class="text-muted small mt-1">当前影响因子: <span id="weatherFactorDisplay" class="fw-bold text-bakery">1.00x</span></div>
        </div>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <input type="date" class="form-control form-control-sm w-auto" id="scheduleDate" />
          <select class="form-select form-select-sm w-auto" id="scheduleStore"></select>
          <select class="form-select form-select-sm w-auto" id="ganttScale">
            <option value="6">6小时视图</option>
            <option value="12" selected>12小时视图</option>
            <option value="24">24小时视图</option>
          </select>
          <button class="btn btn-outline-secondary btn-sm" id="btnCalcSuggest">
            <i class="bi bi-lightbulb me-1"></i>计算建议产量
          </button>
          <button class="btn btn-bakery btn-sm" id="btnGenerateWO">
            <i class="bi bi-check2-circle me-1"></i>生成工单
          </button>
        </div>
      </div>
      <div class="card shadow-sm gantt-card">
        <div class="card-body p-0">
          <div class="gantt-container">
            <div class="gantt-left" id="ganttLeft">
              <div class="gantt-header gantt-header-row">产品 / 品类</div>
              <div id="ganttProductList"></div>
            </div>
            <div class="gantt-right" id="ganttRight">
              <div class="gantt-header gantt-timeline" id="ganttTimeline"></div>
              <div id="ganttBody"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="alert alert-info mt-3">
        <i class="bi bi-info-circle me-2"></i>
        <span>色块按品类区分：<span class="cat-bread">欧包</span> <span class="cat-toast">吐司</span> <span class="cat-cake">蛋糕</span> <span class="cat-pastry">酥点</span> <span class="cat-cookie">饼干</span></span>
        <span class="ms-3"><span class="conflict-box">红色边框</span>表示发酵炉或烤箱时段冲突，请拖拽调整</span>
      </div>
    </div>
  </template>

  <template id="tpl-workorder">
    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-title mb-0">后厨工单看板</h3>
        <select class="form-select form-select-sm w-auto" id="woStore"></select>
      </div>
      <div class="row g-3 kanban-board">
        <div class="col-md-4 kanban-col" data-status="pending">
          <div class="card kanban-card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between">
              <h6 class="mb-0"><i class="bi bi-hourglass-split me-1"></i>待执行</h6>
              <span class="badge bg-light text-dark" id="countPending">0</span>
            </div>
            <div class="card-body kanban-body" id="colPending"></div>
          </div>
        </div>
        <div class="col-md-4 kanban-col" data-status="running">
          <div class="card kanban-card">
            <div class="card-header bg-primary text-white d-flex justify-content-between">
              <h6 class="mb-0"><i class="bi bi-play-circle me-1"></i>进行中</h6>
              <span class="badge bg-light text-dark" id="countRunning">0</span>
            </div>
            <div class="card-body kanban-body" id="colRunning"></div>
          </div>
        </div>
        <div class="col-md-4 kanban-col" data-status="done">
          <div class="card kanban-card">
            <div class="card-header bg-success text-white d-flex justify-content-between">
              <h6 class="mb-0"><i class="bi bi-check-circle me-1"></i>已完成</h6>
              <span class="badge bg-light text-dark" id="countDone">0</span>
            </div>
            <div class="card-body kanban-body" id="colDone"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-pos">
    <div class="pos-container h-100">
      <div class="pos-main">
        <div class="pos-header px-3 py-2 d-flex gap-2 align-items-center">
          <div class="input-group flex-grow-1">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="posSearch" placeholder="扫码 / 品名 / 拼音首字母..." autocomplete="off" />
          </div>
          <select class="form-select w-auto" id="posCategory">
            <option value="">全部品类</option>
            <option value="欧包">欧包</option>
            <option value="吐司">吐司</option>
            <option value="蛋糕">蛋糕</option>
            <option value="酥点">酥点</option>
            <option value="饼干">饼干</option>
          </select>
          <button class="btn btn-outline-bakery" id="btnTogglePanel">
            <i class="bi bi-list-ul"></i>
          </button>
        </div>
        <div class="pos-products p-3" id="posProducts"></div>
      </div>
      <aside class="pos-panel" id="posPanel">
        <div class="pos-panel-header px-3 py-2 d-flex justify-content-between align-items-center">
          <h6 class="mb-0">购物车</h6>
          <button class="btn btn-sm btn-close" id="btnClosePanel"></button>
        </div>
        <div class="pos-cart p-3" id="posCart"></div>
        <div class="pos-member p-3 border-top">
          <div class="input-group mb-2">
            <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
            <input type="text" class="form-control" id="memberPhone" placeholder="输入会员手机号..." maxlength="11" />
            <button class="btn btn-outline-bakery" type="button" id="btnScanBarcode"><i class="bi bi-upc-scan"></i> 扫码</button>
            <button class="btn btn-bakery" type="button" id="btnQueryMember">查询</button>
          </div>
          <div id="memberInfo" class="d-none">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-bold" id="memberName"></div>
                <small class="text-muted" id="memberPhoneDisplay"></small>
              </div>
              <div class="text-end">
                <div class="text-bakery fw-bold fs-5">¥<span id="memberBalance">0</span></div>
                <button class="btn btn-sm btn-outline-bakery mt-1" data-bs-toggle="modal" data-bs-target="#rechargeModal">
                  <i class="bi bi-plus-circle me-1"></i>充值
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="pos-summary p-3 border-top">
          <div class="mb-2">
            <label class="form-label small text-muted">整单折扣</label>
            <div class="d-flex gap-2">
              <input type="number" class="form-control form-control-sm" id="cartDiscount" min="0" max="100" value="0" />
              <span class="align-self-center">%</span>
            </div>
          </div>
          <div class="d-flex justify-content-between"><span>商品金额</span><span>¥<span id="subTotal">0</span></span></div>
          <div class="d-flex justify-content-between text-muted"><span>折扣</span><span>-¥<span id="discountAmount">0</span></span></div>
          <hr class="my-2" />
          <div class="d-flex justify-content-between fw-bold fs-5"><span>应收</span><span class="text-bakery">¥<span id="totalAmount">0</span></span></div>
          <div class="mt-3">
            <label class="form-label small text-muted">实收（现金）</label>
            <input type="number" class="form-control form-control-lg" id="cashPaid" min="0" step="0.01" placeholder="0" />
            <div class="d-flex justify-content-between mt-1"><span class="text-muted">找零</span><span class="fw-bold text-success">¥<span id="changeAmount">0</span></span></div>
          </div>
          <div class="d-grid gap-2 mt-3">
            <button class="btn btn-bakery btn-lg" id="btnCheckoutMember">
              <i class="bi bi-credit-card me-1"></i>会员储值支付
            </button>
            <button class="btn btn-outline-bakery btn-lg" id="btnCheckoutCash">
              <i class="bi bi-cash me-1"></i>现金结算
            </button>
            <button class="btn btn-outline-secondary btn-sm" id="btnClearCart">清空购物车</button>
          </div>
        </div>
      </aside>
    </div>

    <div class="modal fade" id="scanModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-upc-scan me-2"></i>扫描会员卡</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <div class="scan-area mb-3">
              <i class="bi bi-qr-code-scan fs-1 text-bakery"></i>
              <div class="text-muted mt-2">将条码对准扫描框</div>
              <div class="scan-frame mt-3"></div>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">模拟扫码输入</label>
              <input type="text" class="form-control text-center" id="scanInput" placeholder="输入或扫描会员卡号" />
              <div class="invalid-feedback" id="scanError"></div>
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-bakery" id="btnScanConfirm">查询会员</button>
              <button class="btn btn-outline-secondary" id="btnSimulateScan">模拟随机扫码</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="rechargeModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">储值充值</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">充值金额</label>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-outline-bakery recharge-option" data-amount="100">¥100</button>
                <button class="btn btn-outline-bakery recharge-option" data-amount="300">¥300 <span class="text-success">送30</span></button>
                <button class="btn btn-outline-bakery recharge-option" data-amount="500">¥500 <span class="text-success">送60</span></button>
                <button class="btn btn-outline-bakery recharge-option" data-amount="1000">¥1000 <span class="text-success">送150</span></button>
              </div>
            </div>
            <div class="mb-3">
              <input type="number" class="form-control form-control-lg" id="rechargeAmount" min="1" placeholder="自定义金额" />
            </div>
            <div class="alert alert-warning">
              <i class="bi bi-gift me-1"></i>赠送规则：充300送30，充500送60，充1000送150
            </div>
            <div class="d-flex justify-content-between fw-bold">
              <span>预计到账</span><span class="text-bakery fs-4">¥<span id="rechargeTotal">0</span></span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-bakery" id="btnConfirmRecharge">确认充值</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="receiptModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">小票预览</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="receipt p-4" id="receiptContent"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button type="button" class="btn btn-bakery" onclick="window.print()">打印小票</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-transfer">
    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-title mb-0">跨店调拨管理</h3>
        <button class="btn btn-bakery" id="btnNewTransfer">
          <i class="bi bi-plus-circle me-1"></i>新建调拨单
        </button>
      </div>
      <div class="card shadow-sm mb-4" id="transferFormCard" style="display:none;">
        <div class="card-header"><h6 class="mb-0">新建调拨单</h6></div>
        <div class="card-body">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">调出店</label>
              <select class="form-select" id="fromStore"></select>
              <div class="form-text text-danger d-none" id="errFromStore">请选择调出店</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">调入店</label>
              <select class="form-select" id="toStore"></select>
              <div class="form-text text-danger d-none" id="errToStore">调入店不能与调出店相同</div>
            </div>
            <div class="col-md-4 align-self-end">
              <button class="btn btn-secondary" id="btnCancelTransfer">取消</button>
              <button class="btn btn-bakery" id="btnSubmitTransfer">提交调拨</button>
            </div>
          </div>
          <div class="mb-2 d-flex gap-2">
            <input type="text" class="form-control w-auto" id="transferSearch" placeholder="搜索产品..." />
          </div>
          <div class="table-responsive">
            <table class="table table-hover" id="transferProductTable">
              <thead>
                <tr>
                  <th style="width:50px;"><input type="checkbox" id="checkAllProduct" /></th>
                  <th>产品</th>
                  <th>品类</th>
                  <th>调出店库存</th>
                  <th>调拨数量</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs" id="transferTabs">
            <li class="nav-item"><a class="nav-link active" data-status="all" href="#">全部</a></li>
            <li class="nav-item"><a class="nav-link" data-status="frozen" href="#">待确认</a></li>
            <li class="nav-item"><a class="nav-link" data-status="pending" href="#">待收货</a></li>
            <li class="nav-item"><a class="nav-link" data-status="done" href="#">已完成</a></li>
          </ul>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>单号</th>
                <th>调出店</th>
                <th>调入店</th>
                <th>商品数</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="transferList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-member">
    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-title mb-0">会员管理</h3>
        <button class="btn btn-bakery" id="btnNewMember" data-bs-toggle="modal" data-bs-target="#memberModal">
          <i class="bi bi-person-plus me-1"></i>新增会员
        </button>
      </div>
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex gap-2">
              <input type="text" class="form-control form-control-sm" id="memberSearch" placeholder="搜索手机号/姓名..." />
            </div>
            <div class="card-body p-0">
              <table class="table table-hover mb-0" id="memberList">
                <thead><tr><th>手机号</th><th>姓名</th><th>余额</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <h6 class="mb-0">会员详情 <small class="text-muted" id="memberDetailName"></small></h6>
            </div>
            <div class="card-body" id="memberDetailEmpty">
              <div class="text-center text-muted py-5">
                <i class="bi bi-person-circle fs-1"></i>
                <div class="mt-2">请选择左侧会员查看详情</div>
              </div>
            </div>
            <div class="card-body d-none" id="memberDetailPanel">
              <div class="row mb-4">
                <div class="col-sm-6">
                  <div class="text-muted small">手机号</div>
                  <div class="fw-bold" id="detailPhone"></div>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">注册时间</div>
                  <div id="detailCreated"></div>
                </div>
                <div class="col-sm-6 mt-3">
                  <div class="text-muted small">账户余额</div>
                  <div class="text-bakery fw-bold fs-3">¥<span id="detailBalance"></span></div>
                </div>
                <div class="col-sm-6 mt-3 align-self-end">
                  <button class="btn btn-bakery" data-bs-toggle="modal" data-bs-target="#rechargeModalMember">
                    <i class="bi bi-plus-circle me-1"></i>充值
                  </button>
                </div>
              </div>
              <h6>交易流水</h6>
              <div class="timeline" id="memberTimeline"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="memberModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">新增会员</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">手机号 <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="newMemberPhone" maxlength="11" placeholder="11位手机号" />
              <div class="form-text text-danger d-none" id="errPhone">请输入正确的11位手机号</div>
            </div>
            <div class="mb-3">
              <label class="form-label">姓名 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="newMemberName" placeholder="会员姓名" />
              <div class="form-text text-danger d-none" id="errName">请输入姓名</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-bakery" id="btnSaveMember">确认开卡</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="rechargeModalMember" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">储值充值</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-outline-bakery mrecharge-option" data-amount="100">¥100</button>
                <button class="btn btn-outline-bakery mrecharge-option" data-amount="300">¥300 <span class="text-success">送30</span></button>
                <button class="btn btn-outline-bakery mrecharge-option" data-amount="500">¥500 <span class="text-success">送60</span></button>
                <button class="btn btn-outline-bakery mrecharge-option" data-amount="1000">¥1000 <span class="text-success">送150</span></button>
              </div>
            </div>
            <div class="mb-3">
              <input type="number" class="form-control form-control-lg" id="mrechargeAmount" min="1" placeholder="自定义金额" />
            </div>
            <div class="d-flex justify-content-between fw-bold">
              <span>预计到账</span><span class="text-bakery fs-4">¥<span id="mrechargeTotal">0</span></span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-bakery" id="btnConfirmRechargeMember">确认充值</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-report">
    <div class="container-fluid p-4">
      <h3 class="page-title mb-4">报表分析</h3>
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label small text-muted">开始日期</label>
              <input type="date" class="form-control form-control-sm" id="rptStart" />
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted">结束日期</label>
              <input type="date" class="form-control form-control-sm" id="rptEnd" />
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">门店（可多选）</label>
              <select class="form-select form-select-sm" id="rptStores" multiple size="3"></select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-bakery btn-sm w-100" id="btnApplyFilter">
                <i class="bi bi-funnel me-1"></i>应用筛选
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">销售汇总</h6>
              <button class="btn btn-sm btn-outline-secondary btn-export" data-chart="dailyChart">
                <i class="bi bi-download"></i> PNG
              </button>
            </div>
            <div class="card-body"><canvas id="dailyChart" height="200"></canvas></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">品类销售占比</h6>
              <button class="btn btn-sm btn-outline-secondary btn-export" data-chart="categoryChart">
                <i class="bi bi-download"></i> PNG
              </button>
            </div>
            <div class="card-body"><canvas id="categoryChart" height="200"></canvas></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">报废率趋势</h6>
              <button class="btn btn-sm btn-outline-secondary btn-export" data-chart="wasteChart">
                <i class="bi bi-download"></i> PNG
              </button>
            </div>
            <div class="card-body"><canvas id="wasteChart" height="200"></canvas></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0">门店销售对比</h6>
              <button class="btn btn-sm btn-outline-secondary btn-export" data-chart="storeChart">
                <i class="bi bi-download"></i> PNG
              </button>
            </div>
            <div class="card-body"><canvas id="storeChart" height="200"></canvas></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-backup">
    <div class="container-fluid p-4">
      <h3 class="page-title mb-4">数据备份与恢复</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white"><h6 class="mb-0"><i class="bi bi-cloud-download me-2"></i>导出数据</h6></div>
            <div class="card-body">
              <p class="text-muted">将所有业务数据导出为JSON备份文件，可用于迁移或存档。</p>
              <div class="mb-3">
                <div class="text-muted small">当前数据版本</div>
                <div class="fw-bold" id="currentVersion">v1.0.0</div>
              </div>
              <button class="btn btn-bakery btn-lg w-100" id="btnExportData">
                <i class="bi bi-file-earmark-arrow-down me-2"></i>导出全量JSON
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-white"><h6 class="mb-0"><i class="bi bi-cloud-upload me-2"></i>导入数据</h6></div>
            <div class="card-body">
              <p class="text-muted">选择之前导出的JSON文件进行数据恢复，导入时将自动校验数据版本与完整性。</p>
              <div class="mb-3">
                <input type="file" class="form-control" id="importFile" accept=".json" />
              </div>
              <div id="importStatus" class="mb-3"></div>
              <button class="btn btn-outline-bakery btn-lg w-100" id="btnImportData">
                <i class="bi bi-file-earmark-arrow-up me-2"></i>导入并覆盖当前数据
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-12">
          <div class="card shadow-sm border-warning">
            <div class="card-header bg-warning bg-opacity-10">
              <h6 class="mb-0"><i class="bi bi-stars me-2"></i>初始化示例数据</h6>
            </div>
            <div class="card-body">
              <p class="text-muted">首次使用请点击下方按钮，系统将初始化5家门店、120个SKU、工序模板、示例会员及演示销售数据。</p>
              <button class="btn btn-outline-warning w-100" id="btnSeedDemo">
                <i class="bi bi-database-add me-2"></i>重置并载入演示数据
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/models.js"></script>
  <script src="js/router.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
