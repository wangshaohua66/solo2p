server:
  port: 8085

spring:
  application:
    name: interview-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: talent-market
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/talent_market?useUnicode=true&characterEncoding=utf8
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.talentmarket.interview.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

webrtc:
  room:
    max-participants: 10
    timeout: 3600
