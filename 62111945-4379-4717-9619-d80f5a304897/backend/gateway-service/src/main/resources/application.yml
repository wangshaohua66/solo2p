server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: talent-market
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: enterprise-service
          uri: lb://enterprise-service
          predicates:
            - Path=/api/enterprise/**
          filters:
            - StripPrefix=2
        - id: recruitment-service
          uri: lb://recruitment-service
          predicates:
            - Path=/api/recruitment/**
          filters:
            - StripPrefix=2
        - id: jobseeker-service
          uri: lb://jobseeker-service
          predicates:
            - Path=/api/jobseeker/**
          filters:
            - StripPrefix=2
        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/api/interview/**
          filters:
            - StripPrefix=2
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=2
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

jwt:
  secret: talent-market-platform-secret-key-2024-abcdef
  expire: 86400

auth:
  skip-urls:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/captcha
    - /*.html
    - /*.js
    - /*.css
    - /favicon.ico
