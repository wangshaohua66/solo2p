<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>明视眼镜 · 门店运营管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- 左侧导航 -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><i class="bi bi-eye-fill"></i></span>
        <span class="brand-text">明视眼镜<span class="brand-sub">门店运营管理</span></span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <label class="form-label mb-1">当前门店</label>
        <select class="form-select form-select-sm" id="storeSwitcher"></select>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="app-main">
      <header class="app-topbar">
        <button class="btn btn-icon d-lg-none" id="sidebarToggle" aria-label="菜单">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title" id="topbarTitle">工作台</div>
        <div class="topbar-actions">
          <span class="topbar-date" id="topbarDate"></span>
          <button class="btn btn-icon" id="asideToggle" title="快捷面板">
            <i class="bi bi-bell"></i>
            <span class="dot-badge" id="notifyDot"></span>
          </button>
        </div>
      </header>
      <div class="app-content" id="appContent"></div>
    </main>

    <!-- 右侧快捷面板 -->
    <aside class="app-aside" id="appAside">
      <div class="aside-header">
        <h6 class="mb-0"><i class="bi bi-lightning-charge-fill text-teal me-1"></i>快捷面板</h6>
        <button class="btn btn-icon btn-sm d-md-none" id="asideClose"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="aside-body" id="quickPanel"></div>
    </aside>

    <div class="app-overlay" id="appOverlay"></div>
  </div>

  <!-- 模态框挂载点 -->
  <div id="modalRoot"></div>
  <!-- Toast 挂载点 -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastRoot" style="z-index: 1090;"></div>

  <!-- 依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 应用脚本（顺序加载） -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/optometry.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/processing.js"></script>
  <script src="js/modules/schedule.js"></script>
  <script src="js/modules/member.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
