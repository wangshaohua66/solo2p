model:
  default_algorithm: random_forest
  algorithms:
    random_forest:
      n_estimators: 100
      max_depth: 20
      min_samples_split: 2
      min_samples_leaf: 1
      random_state: 42
    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      random_state: 42
    lstm:
      hidden_size: 50
      num_layers: 2
      learning_rate: 0.001
      epochs: 200
      sequence_length: 24
      random_state: 42
  hyperparameter_tuning:
    enabled: false
    cv_folds: 5
    param_grid:
      random_forest:
        n_estimators: [50, 100, 200]
        max_depth: [10, 20, 30]
      gradient_boosting:
        n_estimators: [50, 100, 200]
        learning_rate: [0.05, 0.1, 0.2]
      lstm:
        hidden_size: [32, 50, 64]
        sequence_length: [12, 24, 48]

paths:
  data_dir: ./data
  model_dir: ./models
  output_dir: ./output
  config_file: ./config/config.yaml

prediction:
  horizon_hours: 24
  confidence_level: 0.9
  time_step: 1
  sliding_window_size: 168

data:
  timestamp_column: timestamp
  power_column: power
  weather_columns:
    - temperature
    - humidity
    - wind_speed
    - solar_radiation
    - pressure
  missing_value_strategy: interpolate
  outlier_threshold: 3.0
  resample_freq: 1h
  min_data_points: 100

evaluation:
  metrics:
    - mae
    - rmse
    - mape
    - nrmse
  sliding_window_evaluation: false
  window_size: 168
  baseline_comparison: false

output:
  format: csv
  decimal_places: 2
  include_confidence_interval: true
  generate_charts: true
  chart_format: html

thresholds:
  max_prediction_error: 0.2
  data_quality_min_score: 0.8
  model_performance_min_score: 0.7

logging:
  level: INFO
  verbose: false
  quiet: false
  progress_bar: true
