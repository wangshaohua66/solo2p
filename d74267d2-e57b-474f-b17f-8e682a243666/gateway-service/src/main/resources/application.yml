server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: emergency
      config:
        server-addr: 127.0.0.1:8848
        namespace: emergency
        file-extension: yaml
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true
      scg:
        fallback:
          mode: response
          response-body: '{"code":7003,"message":"请求过于频繁，请稍后再试","data":null,"timestamp":'${system.currentTime}'}'
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@remoteAddrKeyResolver}"

        - id: incident-service
          uri: lb://incident-service
          predicates:
            - Path=/api/incident/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@remoteAddrKeyResolver}"

        - id: dispatch-service
          uri: lb://dispatch-service
          predicates:
            - Path=/api/dispatch/**
          filters:
            - StripPrefix=2

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=2

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: emergency@2024
      database: 0

jwt:
  secret: "emergency-management-system-secret-key-2024-very-long-string-for-security"
  expiration: 86400
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: incident-service
        url: /api/incident/v3/api-docs
      - name: dispatch-service
        url: /api/dispatch/v3/api-docs
      - name: inventory-service
        url: /api/inventory/v3/api-docs
      - name: notification-service
        url: /api/notification/v3/api-docs

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3
      excluded-services: gateway-service

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.emergency.gateway: DEBUG
