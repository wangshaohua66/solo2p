version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: emergency-postgres
    environment:
      POSTGRES_DB: emergency
      POSTGRES_USER: emergency
      POSTGRES_PASSWORD: emergency@2024
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: emergency-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: postgres
      MYSQL_SERVICE_PORT: 5432
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: emergency
      MYSQL_SERVICE_PASSWORD: emergency@2024
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emergency-network

  redis:
    image: redis:7.2-alpine
    container_name: emergency-redis
    command: redis-server --requirepass emergency@2024 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - emergency-network

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: emergency-sentinel
    ports:
      - "8858:8858"
    networks:
      - emergency-network

volumes:
  postgres-data:
  redis-data:

networks:
  emergency-network:
    driver: bridge
