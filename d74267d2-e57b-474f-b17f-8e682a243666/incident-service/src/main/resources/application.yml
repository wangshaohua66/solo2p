server:
  port: 8082

spring:
  application:
    name: incident-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: emergency
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8721
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/emergency?useUnicode=true&characterEncoding=utf8&currentSchema=emergency
    username: emergency
    password: emergency@2024
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: emergency@2024
      database: 2

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.emergency.incident.entity
  type-handlers-package: com.emergency.incident.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

knife4j:
  enable: true
  openapi:
    title: 灾情事件管理API
    description: 灾情上报、分级、规则引擎接口
    version: 1.0.0

logging:
  level:
    com.emergency.incident: DEBUG
    org.jeasy.rules: DEBUG
