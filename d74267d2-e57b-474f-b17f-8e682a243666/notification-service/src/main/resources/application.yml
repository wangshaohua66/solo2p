server:
  port: 8085

spring:
  application:
    name: notification-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: emergency
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/emergency?useUnicode=true&characterEncoding=utf8&currentSchema=emergency
    username: emergency
    password: emergency@2024
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: emergency@2024
      database: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.emergency.notification.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sms:
  provider: aliyun
  access-key: your-access-key
  secret-key: your-secret-key
  sign-name: 应急管理厅

app-push:
  provider: jpush
  app-key: your-app-key
  master-secret: your-master-secret

broadcast:
  api-url: http://broadcast-server/api/send

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

knife4j:
  enable: true
  openapi:
    title: 预警通知API
    description: 预警通知推送接口文档
    version: 1.0.0

logging:
  level:
    com.emergency.notification: DEBUG
