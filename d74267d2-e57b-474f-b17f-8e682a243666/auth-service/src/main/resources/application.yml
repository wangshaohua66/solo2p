server:
  port: 8081

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: emergency
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8720
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/emergency?useUnicode=true&characterEncoding=utf8&currentSchema=emergency
    username: emergency
    password: emergency@2024
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: emergency@2024
      database: 1

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.emergency.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: "emergency-management-system-secret-key-2024-very-long-string-for-security"
  expiration: 86400
  refresh-expiration: 604800
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 应急管理系统认证授权API
    description: 认证授权服务接口文档
    version: 1.0.0
    concat: admin@emergency.gov.cn

logging:
  level:
    com.emergency.auth: DEBUG
    org.springframework.security: DEBUG
