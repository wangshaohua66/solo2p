<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印刷质量检测数据管理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="styles/custom.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#/sampleRegister">
                <i class="bi bi-printer-fill me-2"></i>
                印刷质量检测管理平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#/sampleRegister" data-route="sampleRegister">
                            <i class="bi bi-clipboard-plus me-1"></i>样本登记
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/detectInput" data-route="detectInput">
                            <i class="bi bi-rulers me-1"></i>检测录入
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/scoreJudge" data-route="scoreJudge">
                            <i class="bi bi-check2-circle me-1"></i>智能判定
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/statistics" data-route="statistics">
                            <i class="bi bi-bar-chart-line me-1"></i>统计分析
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/historyQuery" data-route="historyQuery">
                            <i class="bi bi-search me-1"></i>历史查询
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/reportGen" data-route="reportGen">
                            <i class="bi bi-file-earmark-pdf me-1"></i>报告生成
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-container">
        <div class="row">
            <aside class="col-lg-2 col-md-3 sidebar d-none d-md-block" id="sidebar">
                <div class="sidebar-inner">
                    <h6 class="sidebar-title">
                        <i class="bi bi-info-circle me-1"></i>操作指引
                    </h6>
                    <div id="sidebarGuide" class="sidebar-guide"></div>
                    <hr>
                    <h6 class="sidebar-title">
                        <i class="bi bi-funnel me-1"></i>快捷筛选
                    </h6>
                    <div id="sidebarFilter" class="sidebar-filter"></div>
                    <hr>
                    <div class="mt-3">
                        <small class="text-muted">
                            <i class="bi bi-database me-1"></i>
                            <span id="dataCount">0</span> 条记录
                        </small>
                    </div>
                </div>
            </aside>

            <main class="col-lg-10 col-md-9 ms-sm-auto main-content">
                <div id="app-container" class="pt-3">
                    <div class="d-flex justify-content-center align-items-center" style="height: 60vh;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="globalModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="globalModalTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="globalModalBody"></div>
                <div class="modal-footer" id="globalModalFooter">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-bell-fill me-2"></i>
                <strong class="me-auto">系统提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script data-main="app" src="https://cdn.jsdelivr.net/npm/requirejs@2.3.6/require.min.js"></script>
</body>
</html>
