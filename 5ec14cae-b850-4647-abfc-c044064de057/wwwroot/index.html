<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 养老服务集团运营管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 40px;
    width: 100%;
    max-width: 420px;
}
.login-header {
    text-align: center;
    margin-bottom: 32px;
}
.login-header h1 {
    color: #333;
    font-size: 24px;
    font-weight: 700;
    margin-top: 16px;
}
.login-header p {
    color: #666;
    margin-top: 8px;
}
.logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    color: white;
    font-size: 32px;
}
.form-control {
    border-radius: 8px;
    padding: 12px 16px;
    border: 1px solid #e0e0e0;
}
.form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
}
.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-weight: 600;
    width: 100%;
}
.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}
.user-tips {
    margin-top: 24px;
    padding: 16px;
    background: #f8f9fa;
    border-radius: 8px;
    font-size: 12px;
    color: #666;
}
.user-tips strong {
    color: #333;
}
.alert {
    border-radius: 8px;
    margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div class="logo-icon">🏠</div>
        <h1>养老服务集团运营管理系统</h1>
        <p>Elderly Care Management System</p>
    </div>
    <div id="alert-box"></div>
    <form id="login-form">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
            <label class="form-label">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary">
            <span id="btn-text">登 录</span>
        </button>
    </form>
    <div class="user-tips">
        <p class="mb-2"><strong>测试账号：</strong></p>
        <p class="mb-1">管理员：admin / admin123</p>
        <p class="mb-1">运营总监：manager / manager123</p>
        <p class="mb-1">护士长：nurse / nurse123</p>
        <p class="mb-1">医生：doctor / doctor123</p>
        <p class="mb-1">会计：finance / finance123</p>
        <p>调度员：dispatcher / dispatch123</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = '/api';

$('#login-form').on('submit', async function(e) {
    e.preventDefault();
    const username = $('#username').val();
    const password = $('#password').val();
    $('#login-btn').prop('disabled', true);
    $('#btn-text').html('<span class="spinner-border spinner-border-sm me-2"></span>登录中...');
    $('#alert-box').html('');

    try {
        const res = await fetch(`${API_BASE}/Auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            showAlert('登录成功，正在跳转...', 'success');
            setTimeout(() => location.href = 'views/dashboard.html', 800);
        } else {
            showAlert(data.message || '登录失败', 'danger');
            resetBtn();
        }
    } catch(err) {
        showAlert('网络错误，请稍后重试', 'danger');
        resetBtn();
    }
});

function resetBtn() {
    $('#login-btn').prop('disabled', false);
    $('#btn-text').text('登 录');
}

function showAlert(msg, type) {
    $('#alert-box').html(`<div class="alert alert-${type} mb-0">${msg}</div>`);
}
</script>
</body>
</html>
