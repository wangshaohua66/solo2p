global:
  concurrency: 50
  timeout: 30
  max_retries: 3
  retry_interval: [1, 3, 5]
  user_agent_rotation: true
  request_rate_limit: 2.0
  proxy_list: []

alert:
  enabled: true
  mode: continuous
  price_change_threshold: 0.05
  mail:
    smtp_host: smtp.example.com
    smtp_port: 587
    smtp_user: alert@example.com
    smtp_password: your_password
    from: alert@example.com
    to:
      - admin@example.com
  webhook:
    enabled: false
    url: ""

database:
  path: ./data/price_monitor.db

log:
  level: info
  dir: ./logs
  retention_days: 30

captcha_solver:
  enabled: false
  provider: ocrspace
  api_key: ""
  api_url: "https://api.ocr.space/parse/image"
  language: eng
  timeout: 30

sites:
  - id: tmall
    name: 天猫
    base_url: https://detail.tmall.com
    search_url: https://list.tmall.com/search_product.htm?q={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.5
    selectors:
      price_original: ".tm-price-orig"
      price_promo: ".tm-price"
      price_member: ".tm-price-vip"
      title: ".tb-detail-hd h1"
      sku_id: "#J_SKU .tb-metatit"
      stock: ".tb-stock em"

  - id: jd
    name: 京东
    base_url: https://item.jd.com
    search_url: https://search.jd.com/Search?keyword={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.2
    selectors:
      price_original: ".p-price .price-text"
      price_promo: ".p-price .price"
      price_member: ".price-plus .p-price"
      title: ".sku-name"
      sku_id: ".summary-sku"
      stock: ".stock"

  - id: suning
    name: 苏宁
    base_url: https://product.suning.com
    search_url: https://search.suning.com/{keyword}/
    currency: CNY
    enabled: true
    rate_limit: 1.5
    selectors:
      price_original: ".mainprice-wrap .nprice"
      price_promo: ".mainprice-wrap .price"
      price_member: ".viprice"
      title: ".proinfo-title"
      sku_id: ".proinfo-partno"
      stock: ".stock-num"

  - id: kaola
    name: 考拉
    base_url: https://goods.kaola.com
    search_url: https://search.kaola.com/search.html?key={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.8
    selectors:
      price_original: ".originalPrice"
      price_promo: ".currentPrice"
      price_member: ".memberPrice"
      title: ".goods-title"
      sku_id: ".goods-sku"
      stock: ".stock-info"

  - id: miya
    name: 蜜芽
    base_url: https://www.miyou.com
    search_url: https://www.miyou.com/search?keyword={keyword}
    currency: CNY
    enabled: true
    rate_limit: 2.0
    selectors:
      price_original: ".price-origin"
      price_promo: ".price-now"
      price_member: ".price-vip"
      title: ".goods-name"
      sku_id: ".goods-sn"
      stock: ".stock-tip"

  - id: babytree
    name: 宝宝树
    base_url: https://mall.babytree.com
    search_url: https://mall.babytree.com/search?q={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.8
    selectors:
      price_original: ".origin-price"
      price_promo: ".sale-price"
      price_member: ".vip-price"
      title: ".goods-title"
      sku_id: ".goods-no"
      stock: ".goods-stock"

  - id: beibei
    name: 贝贝网
    base_url: https://www.beibei.com
    search_url: https://www.beibei.com/search?q={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.8
    selectors:
      price_original: ".old-price"
      price_promo: ".new-price"
      price_member: ".member-price"
      title: ".product-name"
      sku_id: ".product-sku"
      stock: ".product-stock"

  - id: haiziwang
    name: 孩子王
    base_url: https://www.haiziwang.com
    search_url: https://www.haiziwang.com/search?keyword={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.5
    selectors:
      price_original: ".market-price"
      price_promo: ".sale-price"
      price_member: ".vip-sale-price"
      title: ".goods-name"
