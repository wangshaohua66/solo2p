      stock: ".stock-status"

  - id: leyou
    name: 乐友
    base_url: https://www.leyou.com
    search_url: https://www.leyou.com/search?q={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.8
    selectors:
