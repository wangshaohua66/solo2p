      stock: ".product-stock"

  - id: aiyingshi
    name: 爱婴室
    base_url: https://www.aiyingshi.com
    search_url: https://www.aiyingshi.com/search?keyword={keyword}
    currency: CNY
    enabled: true
    rate_limit: 2.0
    selectors:
      price_original: ".original-price"
      price_promo: ".promotion-price"
      price_member: ".member-only-price"
      title: ".item-title"
      sku_id: ".item-sku"
      stock: ".item-stock"

  - id: muyingzhijia
    name: 母婴之家
    base_url: https://www.muyingzhijia.com
    search_url: https://www.muyingzhijia.com/search?q={keyword}
    currency: CNY
    enabled: true
    rate_limit: 1.8
    selectors:
      price_original: ".origin-price"
      price_promo: ".present-price"
