server:
  port: 8081

spring:
  application:
    name: mw-auth
  data:
    mongodb:
      uri: ${MW_MONGO_URI:mongodb://127.0.0.1:27017/mw_platform}
    redis:
      host: ${MW_REDIS_HOST:127.0.0.1}
      port: ${MW_REDIS_PORT:6379}
      password: ${MW_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    nacos:
      discovery:
        server-addr: ${MW_NACOS_ADDR:127.0.0.1:8848}
        namespace: ${MW_NACOS_NAMESPACE:public}

mw:
  security:
    jwt:
      secret: ${MW_JWT_SECRET:mw-medical-waste-secret-key-2024-trace-platform}
      access-token-ttl: 7200
      refresh-token-ttl: 604800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mw: INFO
