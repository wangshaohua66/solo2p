[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedwork"
version = "1.0.0"
description = "Seismic waveform data quality monitoring and earthquake event catalog system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "obspy>=1.4.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "ftputil>=5.0.0",
    "python-dateutil>=2.8.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
]

[project.scripts]
seedwork = "seedwork.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedwork = ["*.json", "*.yaml", "*.yml"]
