global:
  timeout: 15000
  maxRetries: 3
  puppeteerMaxInstances: 3
  pagesPerBrowser: 5
  matchThreshold: 60

wechat:
  webhookUrl: ""
  retryCount: 3

sites:
  - id: province-ggzy
    name: 省公共资源交易中心
    type: dynamic
    url: https://ggzy.example.gov.cn/
    listUrl: https://ggzy.example.gov.cn/zbgg/index.jhtml
    schedule: "0 8 * * 1-5"
    listSelector:
      container: ".news-list"
      items: ".news-item"
      title: ".news-title a"
      link: ".news-title a"
      date: ".news-date"
      changeFlag: ".change-tag, .buyi-tag"
    detailSelector:
      title: ".article-title"
      projectNo: ".project-no"
      budget: ".budget-amount"
      bidDeadline: ".bid-deadline"
      openTime: ".open-time"
      qualification: ".qualification-section"
      contact: ".contact-info"
    needsLogin: false
    hasCaptcha: false
    cookies: []

  - id: city-a-ggzy
