    schedule: "0 8,14 * * 1-5"
    listSelector:
      container: ".list-box"
      items: ".list-item"
      title: ".item-title a"
      link: ".item-title a"
      date: ".item-date"
      changeFlag: ".tag-change, .tag-correction"
    detailSelector:
      title: ".detail-title"
      projectNo: ".detail-project-no"
      budget: ".detail-budget"
      bidDeadline: ".detail-deadline"
      openTime: ".detail-open-time"
      qualification: ".detail-qualification"
      contact: ".detail-contact"
    needsLogin: false
    hasCaptcha: false
    cookies: []

