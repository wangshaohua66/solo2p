<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水利综合调度管理平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg topbar fixed-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand brand" href="#/overview">
        <span class="brand-mark"><i class="bi bi-water"></i></span>
        <span class="brand-text">水利综合调度<span class="brand-sub">管理平台</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <i class="bi bi-list"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav nav-tabs mx-auto" id="navList">
          <li class="nav-item"><a class="nav-link" data-route="overview" href="#/overview"><i class="bi bi-geo-alt"></i><span>水情总览</span></a></li>
          <li class="nav-item"><a class="nav-link" data-route="dispatch" href="#/dispatch"><i class="bi bi-toggles"></i><span>调度管理</span></a></li>
          <li class="nav-item"><a class="nav-link" data-route="inspection" href="#/inspection"><i class="bi bi-clipboard-check"></i><span>巡检管理</span></a></li>
          <li class="nav-item"><a class="nav-link" data-route="emergency" href="#/emergency"><i class="bi bi-shield-exclamation"></i><span>预案管理</span></a></li>
          <li class="nav-item"><a class="nav-link" data-route="report" href="#/report"><i class="bi bi-bar-chart-line"></i><span>统计报表</span></a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 nav-tools">
          <button class="btn btn-sm alert-pill" id="alertPill" title="实时告警">
            <i class="bi bi-bell-fill"></i><span class="badge" id="alertCount">0</span>
          </button>
          <div class="role-switch btn-group btn-group-sm">
            <button class="btn" data-role="dispatcher">调度员</button>
            <button class="btn" data-role="inspector">巡检员</button>
            <button class="btn" data-role="admin">管理员</button>
          </div>
          <div class="clock" id="clock">--:--:--</div>
        </div>
      </div>
    </div>
  </nav>

  <header class="pagehead">
    <div class="container-fluid px-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h1 class="pagehead-title" id="pageTitle">水情总览</h1>
        <p class="pagehead-sub" id="pageSub">辖区水情雨情实时监测与洪水演进模拟</p>
      </div>
      <div class="quickstats" id="quickStats"></div>
    </div>
  </header>

  <main id="app" class="app-shell container-fluid px-3"></main>

  <footer class="statusbar">
    <div class="container-fluid px-3 d-flex flex-wrap justify-content-between gap-2 small">
      <span><i class="bi bi-circle-fill status-dot ok"></i> 数据通道正常 · 遥测10分钟轮询</span>
      <span id="roleLabel">当前角色：调度员</span>
      <span>区域水利管理局 · 水利综合调度管理平台 v1.0</span>
    </div>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastZone"></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/dispatch.js"></script>
  <script src="js/pages/inspection.js"></script>
  <script src="js/pages/emergency.js"></script>
  <script src="js/pages/report.js"></script>
</body>
</html>
