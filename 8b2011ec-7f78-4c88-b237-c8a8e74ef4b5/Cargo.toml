[package]
name = "radmon"
version = "1.0.0"
edition = "2021"
description = "辐射监测数据管理命令行工具"

[[bin]]
name = "radmon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
comfy-table = "7.0"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
rand = "0.8"
