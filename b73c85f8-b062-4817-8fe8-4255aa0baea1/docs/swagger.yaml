basePath: /
definitions:
  alarm.MatchResult:
    properties:
      alarm:
        $ref: '#/definitions/model.Alarm'
      matched:
        type: boolean
      rule:
        $ref: '#/definitions/alarm.PressureRule'
      volatility:
        format: float64
        type: number
    type: object
  alarm.PressureDataInput:
    properties:
      pressure_value:
        minimum: 0
        type: number
      station_id:
        type: integer
      timestamp:
        type: string
    required:
    - pressure_value
    - station_id
    type: object
  alarm.PressureRule:
    properties:
      description:
        type: string
      id:
        type: string
      level:
        $ref: '#/definitions/model.AlarmLevel'
      name:
        type: string
      type:
        $ref: '#/definitions/model.AlarmType'
    type: object
  handler.AcceptTaskRequest:
    properties:
      inspector_id:
        type: integer
    required:
    - inspector_id
    type: object
  handler.CompleteTaskRequest:
    properties:
      remark:
        type: string
    type: object
  handler.CreateValveOperationRequest:
    properties:
      operation_time:
        type: string
      operation_type:
        allOf:
        - $ref: '#/definitions/model.ValveOperationType'
        enum:
        - OPEN
        - CLOSE
        - ADJUST
      operator_id:
        type: integer
      operator_name:
        type: string
      pressure_after:
        minimum: 0
        type: number
      pressure_before:
        minimum: 0
        type: number
      reason:
        type: string
      remark:
        type: string
      valve_no:
        type: string
      valve_well_id:
        type: integer
    required:
    - operation_type
    - operator_id
    - operator_name
    - pressure_after
    - pressure_before
    - reason
    - valve_no
    - valve_well_id
    type: object
  handler.DispatchAlarmRequest:
    properties:
      location:
        type: string
    required:
    - location
    type: object
  handler.GeneratePlanRequest:
    properties:
      date:
        type: string
    type: object
  handler.SubmitTrackRequest:
    properties:
      inspector_id:
        type: integer
      task_id:
        type: integer
      track_points:
        items:
          $ref: '#/definitions/service.TrackPoint'
        minItems: 1
        type: array
    required:
    - inspector_id
    - task_id
    - track_points
    type: object
  handler.UpdateOrderStatusRequest:
    properties:
      remark:
        type: string
      status:
        enum:
        - DISPATCHED
        - ARRIVED
        - PROCESSING
        - COMPLETED
        type: string
    required:
    - status
    type: object
  model.Alarm:
    properties:
      alarm_no:
        type: string
      created_at:
        type: string
      description:
        type: string
      dispatched_at:
        type: string
      id:
        type: integer
      level:
        $ref: '#/definitions/model.AlarmLevel'
      location:
        type: string
      pipeline:
        $ref: '#/definitions/model.Pipeline'
      pipeline_id:
        type: integer
      pressure_data_id:
        type: integer
      pressure_value:
        type: number
      resolved_at:
        type: string
      rule_matched:
        type: string
      status:
        $ref: '#/definitions/model.AlarmStatus'
      type:
        $ref: '#/definitions/model.AlarmType'
      updated_at:
        type: string
    type: object
  model.AlarmLevel:
    enum:
    - CRITICAL
    - MAJOR
    - MINOR
    - WARNING
    type: string
    x-enum-varnames:
    - AlarmLevelCritical
    - AlarmLevelMajor
    - AlarmLevelMinor
    - AlarmLevelWarning
  model.AlarmStatus:
    enum:
    - NEW
    - DISPATCHED
    - PROCESSING
    - RESOLVED
    - CLOSED
    type: string
    x-enum-varnames:
    - AlarmStatusNew
    - AlarmStatusDispatched
    - AlarmStatusProcessing
    - AlarmStatusResolved
    - AlarmStatusClosed
  model.AlarmType:
    enum:
    - PRESSURE_HIGH
    - PRESSURE_LOW
    - LEAKAGE
    - VOLATILITY
    type: string
    x-enum-varnames:
    - AlarmTypePressureHigh
    - AlarmTypePressureLow
    - AlarmTypeLeakage
    - AlarmTypeVolatility
  model.Hazard:
    properties:
      accept_result:
        type: string
      accepted_at:
        type: string
      assigned_at:
        type: string
      assignee_id:
        type: integer
      assignee_name:
        type: string
      closed_at:
        type: string
      created_at:
        type: string
      deadline:
        type: string
      description:
        type: string
      hazard_no:
        type: string
      id:
        type: integer
      inspector:
        $ref: '#/definitions/model.Inspector'
      inspector_id:
        type: integer
      level:
        $ref: '#/definitions/model.HazardLevel'
      location:
        type: string
      photos:
        type: string
      pipeline:
        $ref: '#/definitions/model.Pipeline'
      pipeline_id:
        type: integer
      rectified_at:
        type: string
      rectify_desc:
        type: string
      registered_at:
        type: string
      status:
        $ref: '#/definitions/model.HazardStatus'
      updated_at:
        type: string
    type: object
  model.HazardLevel:
    enum:
    - MAJOR
    - NORMAL
    - MINOR
    type: string
    x-enum-varnames:
    - HazardLevelMajor
    - HazardLevelNormal
    - HazardLevelMinor
  model.HazardStatus:
    enum:
    - REGISTERED
    - ASSIGNED
    - RECTIFYING
    - ACCEPTING
    - CLOSED
    type: string
    x-enum-varnames:
    - HazardStatusRegistered
    - HazardStatusAssigned
    - HazardStatusRectifying
    - HazardStatusAccepting
    - HazardStatusClosed
  model.InspectionTask:
    properties:
      accepted_at:
        type: string
      actual_end:
        type: string
      actual_start:
        type: string
      created_at:
        type: string
      id:
        type: integer
      inspector:
        $ref: '#/definitions/model.Inspector'
      inspector_id:
        type: integer
      pipeline:
        $ref: '#/definitions/model.Pipeline'
      pipeline_id:
        type: integer
      plan_date:
        type: string
      plan_end:
        type: string
      plan_start:
        type: string
      remark:
        type: string
      status:
        $ref: '#/definitions/model.InspectionTaskStatus'
      task_no:
        type: string
      updated_at:
        type: string
    type: object
  model.InspectionTaskStatus:
    enum:
    - PENDING
    - ACCEPTED
    - IN_PROGRESS
    - COMPLETED
    - EXPIRED
    type: string
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusAccepted
    - TaskStatusInProgress
    - TaskStatusCompleted
    - TaskStatusExpired
  model.InspectionTrack:
    properties:
      created_at:
        type: string
      deviation:
        type: number
      deviation_points:
        type: string
      id:
        type: integer
      inspector_id:
        type: integer
      is_deviated:
        type: boolean
      submit_time:
        type: string
      task:
        $ref: '#/definitions/model.InspectionTask'
      task_id:
        type: integer
      track_points:
        type: string
    type: object
  model.Inspector:
    properties:
      area:
        type: string
      created_at:
        type: string
      employee_no:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/model.InspectorStatus'
      updated_at:
        type: string
    type: object
  model.InspectorStatus:
    enum:
    - ON_DUTY
    - ON_LEAVE
    - OFF_DUTY
    type: string
    x-enum-varnames:
    - InspectorStatusOnDuty
    - InspectorStatusLeave
    - InspectorStatusOff
  model.MonthlyAssessment:
    properties:
      assessment_no:
        type: string
      completed_tasks:
        type: integer
      completion_rate:
        type: number
      created_at:
        type: string
      generated_at:
        type: string
      grade:
        type: string
      hazard_score:
        type: number
      hazards_closed:
        type: integer
      hazards_reported:
        type: integer
      id:
        type: integer
      inspector:
        $ref: '#/definitions/model.Inspector'
      inspector_id:
        type: integer
      is_passed:
        type: boolean
      month:
        type: integer
      report:
        type: string
      task_score:
        type: number
      total_score:
        type: number
      total_tasks:
        type: integer
      track_deviations:
        type: integer
      track_score:
        type: number
      updated_at:
        type: string
      year:
        type: integer
    type: object
  model.Pipeline:
    properties:
      code:
        type: string
      created_at:
        type: string
      end_point:
        type: string
      gate_station_id:
        type: integer
      id:
        type: integer
      length:
        type: number
      level:
        $ref: '#/definitions/model.PipelineLevel'
      name:
        type: string
      route_coords:
        type: string
      start_point:
        type: string
      updated_at:
        type: string
    type: object
  model.PipelineLevel:
    enum:
    - LEVEL1
    - LEVEL2
    - LEVEL3
    type: string
    x-enum-varnames:
    - PipelineLevel1
    - PipelineLevel2
    - PipelineLevel3
  model.PressureData:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_archived:
        type: boolean
      pressure_value:
        type: number
      station:
        $ref: '#/definitions/model.PressureRegulatingStation'
      station_id:
        type: integer
      timestamp:
        type: string
    type: object
  model.PressureRegulatingStation:
    properties:
      address:
        type: string
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      location:
        type: string
      max_pressure:
        type: number
      min_pressure:
        type: number
      name:
        type: string
      normal_pressure:
        type: number
      updated_at:
        type: string
    type: object
  model.RepairOrder:
    properties:
      alarm:
        $ref: '#/definitions/model.Alarm'
      alarm_id:
        type: integer
      arrived_at:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      dispatch_reason:
        type: string
      distance:
        type: number
      id:
        type: integer
      order_no:
        type: string
      remark:
        type: string
      repair_team:
        $ref: '#/definitions/model.RepairTeam'
      repair_team_id:
        type: integer
      status:
        $ref: '#/definitions/model.RepairOrderStatus'
      updated_at:
        type: string
      workload_score:
        type: number
    type: object
  model.RepairOrderStatus:
    enum:
    - PENDING
    - DISPATCHED
    - ARRIVED
    - PROCESSING
    - COMPLETED
    type: string
    x-enum-varnames:
    - RepairStatusPending
    - RepairStatusDispatched
    - RepairStatusArrived
    - RepairStatusProcessing
    - RepairStatusCompleted
  model.RepairTeam:
    properties:
      created_at:
        type: string
      current_tasks:
        type: integer
      id:
        type: integer
      leader_name:
        type: string
      location:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/model.RepairTeamStatus'
      team_no:
        type: string
      updated_at:
        type: string
    type: object
  model.RepairTeamStatus:
    enum:
    - IDLE
    - BUSY
    - ON_SITE
    type: string
    x-enum-varnames:
    - TeamStatusIdle
    - TeamStatusBusy
    - TeamStatusOnSite
  model.ValveOperation:
    properties:
      created_at:
        type: string
      id:
        type: integer
      operation_no:
        type: string
      operation_time:
        type: string
      operation_type:
        $ref: '#/definitions/model.ValveOperationType'
      operator_id:
        type: integer
      operator_name:
        type: string
      pressure_after:
        type: number
      pressure_before:
        type: number
      reason:
        type: string
      remark:
        type: string
      valve_no:
        type: string
      valve_well:
        $ref: '#/definitions/model.ValveWell'
      valve_well_id:
        type: integer
    type: object
  model.ValveOperationType:
    enum:
    - OPEN
    - CLOSE
    - ADJUST
    type: string
    x-enum-varnames:
    - ValveOpOpen
    - ValveOpClose
    - ValveOpAdjust
  model.ValveWell:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      pipeline_id:
        type: integer
      updated_at:
        type: string
      valve_count:
        type: integer
    type: object
  response.PageResult:
    properties:
      list: {}
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.AcceptHazardRequest:
    properties:
      hazard_id:
        type: integer
      is_passed:
        type: boolean
      result:
        type: string
    required:
    - hazard_id
    - result
    type: object
  service.AssessmentResult:
    properties:
      generated:
        type: integer
      message:
        type: string
      skipped:
        type: integer
    type: object
  service.AssignHazardRequest:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
      deadline_days:
        type: integer
      hazard_id:
        type: integer
    required:
    - assignee_id
    - assignee_name
    - hazard_id
    type: object
  service.CloseHazardRequest:
    properties:
      hazard_id:
        type: integer
    required:
    - hazard_id
    type: object
  service.DailyStatsResponse:
    properties:
      avg_pressure:
        type: number
      date:
        type: string
      max_pressure:
        type: number
      min_pressure:
        type: number
      volatility:
        type: number
    type: object
  service.DispatchResult:
    properties:
      dispatch_reason:
        type: string
      distance:
        type: number
      leader_name:
        type: string
      order_no:
        type: string
      phone:
        type: string
      team_id:
        type: integer
      team_name:
        type: string
      workload_score:
        type: number
    type: object
  service.FiveMinStatsResponse:
    properties:
      avg_pressure:
        type: number
      data_count:
        type: integer
      max_pressure:
        type: number
      min_pressure:
        type: number
      window:
        type: string
    type: object
  service.GenerateAssessmentRequest:
    properties:
      inspector_id:
        type: integer
      month:
        maximum: 12
        minimum: 1
        type: integer
      year:
        type: integer
    required:
    - month
    - year
    type: object
  service.HourlyStatsResponse:
    properties:
      avg_pressure:
        type: number
      hour:
        type: string
      max_pressure:
        type: number
      min_pressure:
        type: number
    type: object
  service.MonthlyStatsResponse:
    properties:
      avg_pressure:
        type: number
      max_pressure:
        type: number
      min_pressure:
        type: number
      month:
        type: string
      volatility:
        type: number
    type: object
  service.PlanGenerationResult:
    properties:
      generated_tasks:
        type: integer
      message:
        type: string
    type: object
  service.ReassignRequest:
    properties:
      end_date:
        type: string
      leave_inspector_id:
        type: integer
      start_date:
        type: string
    required:
    - end_date
    - leave_inspector_id
    - start_date
    type: object
  service.ReassignResult:
    properties:
      assignments:
        items:
          $ref: '#/definitions/service.TaskAssignment'
        type: array
      reassigned_tasks:
        type: integer
    type: object
  service.RectifyHazardRequest:
    properties:
      description:
        type: string
      hazard_id:
        type: integer
    required:
    - description
    - hazard_id
    type: object
  service.RegisterHazardRequest:
    properties:
      description:
        minLength: 10
        type: string
      inspector_id:
        type: integer
      level:
        allOf:
        - $ref: '#/definitions/model.HazardLevel'
        enum:
        - MAJOR
        - NORMAL
        - MINOR
      location:
        type: string
      photos:
        items:
          type: string
        type: array
      pipeline_id:
        type: integer
    required:
    - description
    - inspector_id
    - level
    - pipeline_id
    type: object
  service.TaskAssignment:
    properties:
      new_inspector:
        type: integer
      new_name:
        type: string
      old_inspector:
        type: integer
      task_id:
        type: integer
    type: object
  service.TrackCheckResult:
    properties:
      avg_deviation:
        type: number
      deviation_points:
        items:
          $ref: '#/definitions/service.TrackPoint'
        type: array
      is_deviated:
        type: boolean
      max_deviation:
        type: number
    type: object
  service.TrackPoint:
    properties:
      lat:
        type: number
      lng:
        type: number
      timestamp:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 城市燃气管网巡检计划、泄漏报警抢修调度、阀门操作台账、隐患闭环管理、压力趋势分析、巡检轨迹核查的综合管理系统
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: 燃气管网巡检与抢修调度系统
  version: "1.0"
paths:
  /api/v1/alarm/alarms:
    get:
      consumes:
      - application/json
      description: 分页查询告警列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 告警状态
        in: query
        name: status
        type: string
      - description: 告警级别
        in: query
        name: level
        type: string
      - description: 告警类型
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageResult'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/model.Alarm'
                        type: array
                    type: object
              type: object
      summary: 查询告警列表
      tags:
      - 报警与抢修
  /api/v1/alarm/alarms/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取告警详情
      parameters:
      - description: 告警ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Alarm'
              type: object
      summary: 获取告警详情
      tags:
      - 报警与抢修
  /api/v1/alarm/alarms/{id}/dispatch:
    post:
      consumes:
      - application/json
      description: 对告警进行抢修调度，自动计算最优抢修队
      parameters:
      - description: 告警ID
        in: path
        name: id
        required: true
        type: integer
      - description: 位置信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DispatchAlarmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.DispatchResult'
              type: object
      summary: 调度抢修
      tags:
      - 报警与抢修
  /api/v1/alarm/alarms/check-overdue:
    post:
      consumes:
      - application/json
      description: 检查超过DispatchTimeout秒未调度的告警，自动升级通知主管
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Alarm'
                  type: array
              type: object
      summary: 检查超时未调度告警
      tags:
      - 报警与抢修
  /api/v1/alarm/pressure-data:
    post:
      consumes:
      - application/json
      description: SCADA系统推送压力数据，引擎自动匹配规则生成告警
      parameters:
      - description: 压力数据
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/alarm.PressureDataInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/alarm.MatchResult'
                  type: array
              type: object
      summary: 推送压力数据
      tags:
      - 报警与抢修
  /api/v1/alarm/pressure-data/archive:
    post:
      consumes:
      - application/json
      description: 归档超过180天的压力数据为日均值
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  format: int64
                  type: integer
              type: object
      summary: 归档压力数据
      tags:
      - 报警与抢修
  /api/v1/alarm/pressure-data/batch:
    post:
      consumes:
      - application/json
      description: 批量推送压力数据
      parameters:
      - description: 压力数据列表
        in: body
        name: data
        required: true
        schema:
          items:
            $ref: '#/definitions/alarm.PressureDataInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/alarm.MatchResult'
                  type: array
              type: object
      summary: 批量推送压力数据
