[package]
name = "ship-agent"
version = "1.0.0"
edition = "2021"
authors = ["Ship Agent System"]
description = "船舶代理港口使费管理系统 - Port Agency Fee Management System"

[dependencies]
structopt = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.30", features = ["chrono", "bundled"] }
tabwriter = "1.4"
colored = "2.1"
toml = "0.8"
dirs = "5.0"
csv = "1.3"
rayon = "1.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
