<div class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <a href="#auctions" class="text-gold" style="font-size:0.85rem"><i class="bi bi-arrow-left me-1"></i>返回拍卖会列表</a>
      <h4 class="mt-2 mb-0" id="auction-detail-title"></h4>
    </div>
    <div id="auction-detail-type"></div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card-dark p-4">
        <div class="text-center mb-3">
          <div style="font-family:var(--font-num);color:var(--text-muted);font-size:0.85rem" id="auction-lot-number"></div>
          <img id="auction-lot-image" src="" alt="拍品" style="max-height:300px;max-width:100%;object-fit:contain;border-radius:var(--radius-md)">
          <h5 class="mt-3" id="auction-lot-name"></h5>
        </div>

        <div class="text-center mb-4">
          <div style="font-size:0.8rem;color:var(--text-muted)">当前出价</div>
          <div class="bid-price-display number-flip" id="auction-current-bid">¥0</div>
        </div>

        <div class="d-flex justify-content-center gap-3 flex-wrap mb-3">
          <button class="btn btn-bid" id="bid-increment-btn">+¥0</button>
          <div class="d-flex align-items-center gap-2">
            <input type="number" class="form-control" id="bid-custom-amount" placeholder="自定义金额" style="width:160px">
            <button class="btn btn-gold-outline" id="bid-custom-btn">出价</button>
          </div>
        </div>

        <div class="text-center">
          <button class="btn btn-hammer" id="btn-hammer">
            <i class="bi bi-hammer me-2"></i>落槌
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card-dark p-4 mb-4">
        <h6 class="mb-3"><i class="bi bi-trophy me-1"></i>出价排行</h6>
        <div id="auction-leaderboard"></div>
      </div>

      <div class="card-dark p-4 mb-4 text-center">
        <h6 class="mb-3"><i class="bi bi-stopwatch me-1"></i>倒计时</h6>
        <div class="countdown-ring mx-auto" id="countdown-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-progress" cx="60" cy="60" r="52"
              stroke-dasharray="326.73" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-text">60s</div>
        </div>
      </div>

      <div class="card-dark p-4">
        <h6 class="mb-3"><i class="bi bi-collection me-1"></i>拍品导航</h6>
        <div id="auction-lot-nav" style="max-height:200px;overflow-y:auto"></div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12">
      <div class="card-dark p-4">
        <h6 class="mb-3"><i class="bi bi-clock-history me-1"></i>出价记录</h6>
        <div class="table-responsive">
          <table class="table table-dark-custom table-hover mb-0" id="auction-bid-history">
            <thead>
              <tr>
                <th>#</th>
                <th>竞买人</th>
                <th>出价金额</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="4" class="text-center text-muted py-3">暂无出价记录</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
