<div class="py-4">
  <div class="row g-4 mb-4">
    <div class="col-lg-3 col-md-6">
      <div class="kpi-card animate-fade-in-up delay-1">
        <div class="kpi-icon"><i class="bi bi-gem"></i></div>
        <div class="kpi-value" id="kpi-total-lots">-</div>
        <div class="kpi-label">拍品总数</div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="kpi-card animate-fade-in-up delay-2">
        <div class="kpi-icon"><i class="bi bi-graph-up-arrow"></i></div>
        <div class="kpi-value" id="kpi-sold-rate">-</div>
        <div class="kpi-label">成交率</div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="kpi-card animate-fade-in-up delay-3">
        <div class="kpi-icon"><i class="bi bi-cash-coin"></i></div>
        <div class="kpi-value" id="kpi-total-revenue">-</div>
        <div class="kpi-label">总成交额</div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="kpi-card animate-fade-in-up delay-4">
        <div class="kpi-icon"><i class="bi bi-percent"></i></div>
        <div class="kpi-value" id="kpi-avg-premium">-</div>
        <div class="kpi-label">平均溢价率</div>
      </div>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-7">
      <div class="chart-container animate-fade-in-up delay-2">
        <h6><i class="bi bi-graph-up me-1"></i>月度成交率趋势</h6>
        <div style="height:280px">
          <canvas id="chart-sold-rate"></canvas>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="chart-container animate-fade-in-up delay-3">
        <h6><i class="bi bi-pie-chart me-1"></i>拍品类目分布</h6>
        <div style="height:280px">
          <canvas id="chart-category-pie"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-12">
      <div class="chart-container animate-fade-in-up delay-3">
        <h6><i class="bi bi-bar-chart me-1"></i>现场 vs 线上均价对比</h6>
        <div style="height:280px">
          <canvas id="chart-price-compare"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12">
      <div class="chart-container animate-fade-in-up delay-4">
        <h6><i class="bi bi-cash-stack me-1"></i>佣金核算汇总</h6>
        <div class="table-responsive">
          <table class="table table-dark-custom table-hover mb-0" id="dashboard-commission-table">
            <thead>
              <tr>
                <th>拍卖会</th>
                <th>成交数</th>
                <th>总落槌价</th>
                <th>总买家佣金</th>
                <th>总佣金</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="5" class="text-center text-muted py-3">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
