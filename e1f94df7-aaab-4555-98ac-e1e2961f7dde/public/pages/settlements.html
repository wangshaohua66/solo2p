<div class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-cash-stack me-1"></i>结算管理</h4>
    <button class="btn btn-gold-outline btn-sm" id="btn-batch-refund">
      <i class="bi bi-arrow-counterclockwise me-1"></i>批量退款待付款项
    </button>
  </div>

  <ul class="nav nav-tabs settlement-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link settlement-tab active" href="#" data-status="all">全部</a>
    </li>
    <li class="nav-item">
      <a class="nav-link settlement-tab" href="#" data-status="pending">待付款</a>
    </li>
    <li class="nav-item">
      <a class="nav-link settlement-tab" href="#" data-status="paid">已付款</a>
    </li>
    <li class="nav-item">
      <a class="nav-link settlement-tab" href="#" data-status="completed">已完成</a>
    </li>
    <li class="nav-item">
      <a class="nav-link settlement-tab" href="#" data-status="refunded">已退款</a>
    </li>
  </ul>

  <div class="card-dark p-4 mb-4">
    <div class="table-responsive">
      <table class="table table-dark-custom table-hover mb-0" id="settlement-table">
        <thead>
          <tr>
            <th>拍品编号</th>
            <th>拍品名称</th>
            <th>买家</th>
            <th>落槌价</th>
            <th>买家佣金</th>
            <th>合计</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="8" class="text-center text-muted py-3">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="mt-3" id="settlement-pagination"></div>
  </div>

  <div class="card-dark p-4">
    <h6 class="mb-3"><i class="bi bi-calculator me-1"></i>佣金核算汇总</h6>
    <div class="table-responsive">
      <table class="table table-dark-custom table-hover mb-0 fee-table" id="commission-table">
        <thead>
          <tr>
            <th>拍卖会</th>
            <th>成交数</th>
            <th>总落槌价</th>
            <th>总买家佣金</th>
            <th>总佣金</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="text-center text-muted py-3">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
