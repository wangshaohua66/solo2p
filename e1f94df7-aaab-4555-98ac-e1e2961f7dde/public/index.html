<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖行管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body>
<canvas id="particle-canvas"></canvas>

<nav class="navbar navbar-expand-lg fixed-top" id="main-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="#dashboard">
      <i class="bi bi-hammer"></i>
      <span class="brand-text">拍卖行管理系统</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="bi bi-list"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="#dashboard" data-page="dashboard">
            <i class="bi bi-speedometer2"></i> 看板
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#auctions" data-page="auctions">
            <i class="bi bi-shop-window"></i> 拍卖会
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#lots" data-page="lots">
            <i class="bi bi-gem"></i> 拍品
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#settlements" data-page="settlements">
            <i class="bi bi-cash-stack"></i> 结算
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#catalogs" data-page="catalogs">
            <i class="bi bi-book"></i> 图录
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown" id="user-dropdown-wrapper" style="display:none;">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i>
            <span id="current-user-name">用户</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" id="btn-profile"><i class="bi bi-person"></i> 个人信息</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="btn-logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="login-modal-content">
    </div>
  </div>
</div>

<main id="main-content" class="container-fluid">
  <div id="page-container"></div>
</main>

<footer class="text-center py-3" id="app-footer">
  <span>&copy; 2026 拍卖行管理系统 · 深墨金</span>
</footer>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;">
  <div id="app-toast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<div id="loading-overlay" style="display:none;">
  <div class="spinner-border text-gold" role="status">
    <span class="visually-hidden">加载中...</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/lots.js"></script>
<script src="js/auctions.js"></script>
<script src="js/settlements.js"></script>
<script src="js/catalogs.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
