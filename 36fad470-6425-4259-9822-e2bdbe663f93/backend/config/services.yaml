services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Document/'
            - '../src/Kernel.php'
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
    App\Service\ScheduleService:
        arguments:
            $dm: '@doctrine_mongodb.odm.document_manager'
    App\Service\DeviceService:
        arguments:
            $dm: '@doctrine_mongodb.odm.document_manager'
