      - description: 更新字段
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Contract'
              type: object
      security:
      - BearerAuth: []
      summary: 更新合同
      tags:
      - 合同管理
  /api/contracts/{id}/approve:
    post:
      consumes:
      - application/json
      description: 审批通过合同
      parameters:
      - description: 合同ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Contract'
              type: object
      security:
      - BearerAuth: []
      summary: 审批通过合同
      tags:
      - 合同管理
  /api/contracts/{id}/archive:
    post:
      consumes:
      - application/json
      description: 归档合同
      parameters:
      - description: 合同ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
