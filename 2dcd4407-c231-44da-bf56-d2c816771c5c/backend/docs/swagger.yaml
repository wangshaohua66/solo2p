host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 会展中心智慧运营管理系统后端API接口文档，包含档期管理、合同管理、财务结算、展位管理、服务商管理、观众服务、数据分析、系统管理等模块。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 市级国际会展中心智慧运营管理系统 API
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户使用用户名和密码登录系统
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.LoginResponse'
              type: object
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 用户登出系统
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/auth/me:
    get:
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /api/booths:
    get:
      description: 获取展位列表，支持按展厅、状态、区域筛选
      parameters:
      - description: 展厅ID
        in: query
        name: venueId
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 区域
        in: query
        name: zone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Booth'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取展位列表
      tags:
      - 展位管理
    post:
      consumes:
      - application/json
      description: 创建新展位
      parameters:
      - description: 展位信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Booth'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Booth'
              type: object
      security:
      - BearerAuth: []
      summary: 创建展位
      tags:
      - 展位管理
  /api/booths/{id}:
    delete:
      description: 删除展位
      parameters:
      - description: 展位ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: 删除展位
      tags:
      - 展位管理
    get:
      description: 根据ID获取展位详情
      parameters:
      - description: 展位ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Booth'
              type: object
      security:
      - BearerAuth: []
      summary: 获取展位详情
      tags:
      - 展位管理
    put:
      consumes:
      - application/json
      description: 更新展位信息，包括位置、大小、价格、状态等
      parameters:
      - description: 展位ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新字段
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Booth'
              type: object
      security:
      - BearerAuth: []
      summary: 更新展位
      tags:
      - 展位管理
  /api/booths/batch:
    post:
      consumes:
      - application/json
      description: 批量创建多个展位
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: 批量创建展位
      tags:
      - 展位管理
  /api/contracts:
    get:
      description: 分页获取合同列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 状态筛选
        in: query
        name: status
        type: string
      - description: 关键词搜索
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: 获取合同列表
      tags:
      - 合同管理
    post:
      consumes:
      - application/json
      description: 创建新合同
      parameters:
      - description: 合同信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Contract'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Contract'
              type: object
      security:
      - BearerAuth: []
      summary: 创建合同
      tags:
      - 合同管理
  /api/contracts/{id}:
    delete:
      description: 删除合同
      parameters:
      - description: 合同ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
