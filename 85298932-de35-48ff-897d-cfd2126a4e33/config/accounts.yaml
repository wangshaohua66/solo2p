  windowSize: "1366x768"

storage:
  sqlitePath: "./data/assessment.db"
  maxRecordsPerTable: 100000

logging:
  level: "info"
  dir: "./logs"
  maxFileSizeMB: 50
  maxFiles: 30

reports:
  baseDir: "./reports"
  summaryFileName: "batch_summary.csv"
