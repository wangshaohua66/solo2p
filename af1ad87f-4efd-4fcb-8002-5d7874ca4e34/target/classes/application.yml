server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: crew-scheduling
  datasource:
    url: jdbc:mysql://localhost:3306/crew_scheduling?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  cache:
    type: redis
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: CrewScheduling2026SecretKeyForJwtTokenGenerationMustBeLongEnough
  expiration: 86400000

springdoc:
  api-docs:
    path: /swagger-resources
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

crew:
  scheduling:
    max-concurrent-generation: 5
    generation-timeout-minutes: 10
    duty:
      max-continuous-hours: 14
      max-weekly-hours: 60
      max-monthly-hours: 100
      timezone-recovery-hours: 0.5
    fatigue:
      yellow-threshold: 0.8
      red-threshold: 1.0
      risk-score-threshold: 70
    qualification:
      reminder-days: 30,15,7
