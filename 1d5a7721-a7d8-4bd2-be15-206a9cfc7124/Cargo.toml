[package]
name = "atc-analyzer"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "民航空管多雷达数据融合与分析系统"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive", "cargo", "env", "wrap_help", "unicode"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "ansi"] }
tracing-appender = "0.2"
thiserror = "1.0"
nom = "7.1"
byteorder = "1.5"
indicatif = "0.17"
regex = "1.10"
csv = "1.3"
hex = "0.4"
crc = "3.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
num-traits = "0.2"
num_cpus = "1.16"
derive-new = "0.6"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
