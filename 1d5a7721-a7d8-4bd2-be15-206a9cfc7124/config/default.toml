# ========== 民航空管多雷达数据融合与分析系统 ==========
# 配置文件格式: TOML
# 所有配置项均可通过环境变量覆盖, 变量名前缀: ATC_

# ========== 雷达站配置 ==========
# 至少需要配置一个雷达站
[[radar_stations]]
id = "RADAR01"
name = "北京首都雷达站"
latitude = 40.0801
longitude = 116.5846
altitude = 35.0
weight = 1.0

[[radar_stations]]
id = "RADAR02"
name = "上海浦东雷达站"
latitude = 31.1433
longitude = 121.8058
altitude = 25.0
weight = 1.0

[[radar_stations]]
id = "RADAR03"
name = "广州白云雷达站"
latitude = 23.3924
longitude = 113.2988
altitude = 30.0
weight = 1.0

# ========== 安全阈值配置 ==========
[safety_thresholds]
# 水平安全间隔 (米), 默认: 5000
horizontal_separation = 5000.0
# 垂直安全间隔 (米), 默认: 300
vertical_separation = 300.0
# 冲突预测时间窗口 (秒), 默认: 120
lookahead_seconds = 120
# 警告阈值因子, 默认: 1.5 (警告阈值 = 安全间隔 * 警告因子)
warning_factor = 1.5

# ========== 输出配置 ==========
[output]
# 输出格式: text, json, csv
format = "text"
# 输出文件路径, 为空则输出到标准输出
path = ""
# 是否美化JSON输出
pretty_print = true
# 是否在输出中包含时间戳
include_timestamp = true

# ========== 处理配置 ==========
[processing]
# 并行处理线程数, 默认使用CPU核心数
parallelism = 0
# 批处理大小, 默认: 1000
batch_size = 1000
# 时间对齐窗口 (毫秒), 默认: 100
time_alignment_window_ms = 100
# 单条轨迹最大历史点数, 默认: 1000
track_history_size = 1000
# 轨迹超时时间 (毫秒), 超时后自动清理, 默认: 5000
fusion_timeout_ms = 5000

# ========== 日志配置 ==========
[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
# 日志文件路径, 为空则输出到标准错误
file = ""
# 是否使用JSON格式日志
json_format = false
# 是否显示日志目标
show_target = false
# 是否显示模块路径
show_module_path = false
