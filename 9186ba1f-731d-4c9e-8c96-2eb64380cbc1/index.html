<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="汽车快修门店管理系统 - 车辆登记、工单管理、会员服务、统计报表">
    <title>汽车快修门店管理系统</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.10.0/dist/css/bootstrap-datepicker3.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="#/dashboard">
                <i class="bi bi-gear-wide-connected me-2 fs-3 text-primary"></i>
                <span class="fw-bold">快修管家</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-shop me-1"></i>
                            <span id="currentStoreName">中心店</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" id="storeDropdown">
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#/statistics">
                            <i class="bi bi-graph-up me-1"></i>
                            <span>今日营收</span>
                            <span class="badge bg-success ms-1" id="todayRevenueBadge">¥0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/member">
                            <i class="bi bi-person-search me-1"></i>
                            <span>会员查询</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear me-1"></i>
                            <span>系统</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="btnImportBackup"><i class="bi bi-upload me-2"></i>导入数据</a></li>
                            <li><a class="dropdown-item" href="#" id="btnExportBackup"><i class="bi bi-download me-2"></i>导出备份</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="btnClearData"><i class="bi bi-trash me-2"></i>清空数据</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-lg-2 d-lg-block sidebar offcanvas-lg offcanvas-start" id="sidebar">
                <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">功能菜单</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
                </div>
                <div class="offcanvas-body p-0">
                    <nav class="nav flex-column nav-pills mt-2" id="sidebarNav">
                        <a href="#/dashboard" class="nav-link" data-route="dashboard">
                            <i class="bi bi-speedometer2 me-2"></i>仪表盘
                        </a>
                        <a href="#/vehicle" class="nav-link" data-route="vehicle">
                            <i class="bi bi-car-front me-2"></i>车辆登记
                        </a>
                        <a href="#/order" class="nav-link" data-route="order">
                            <i class="bi bi-list-ul me-2"></i>工单管理
                        </a>
                        <a href="#/package" class="nav-link" data-route="package">
                            <i class="bi bi-box-seam me-2"></i>服务套餐
                        </a>
                        <a href="#/member" class="nav-link" data-route="member">
                            <i class="bi bi-people me-2"></i>会员中心
                        </a>
                        <a href="#/statistics" class="nav-link" data-route="statistics">
                            <i class="bi bi-bar-chart me-2"></i>统计报表
                        </a>
                    </nav>

                    <div class="sidebar-footer p-3 border-top mt-3">
                        <div class="text-muted small">
                            <div><i class="bi bi-hdd-stack me-1"></i>存储空间</div>
                            <div class="progress mt-1" style="height: 6px;">
                                <div class="progress-bar" id="storageProgress" style="width: 0%"></div>
                            </div>
                            <div class="mt-1" id="storageInfo">0 MB / 5 MB</div>
                        </div>
                    </div>
                </div>
            </nav>

            <main class="col-lg-10 ms-sm-auto px-md-4 main-content" id="main-content">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3 text-muted">正在加载系统...</p>
                </div>
            </main>
        </div>
    </div>

    <input type="file" id="backupFileInput" accept=".json" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.10.0/dist/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.10.0/dist/locales/bootstrap-datepicker.zh-CN.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/localization/messages_zh.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/validator.js"></script>
    <script src="js/utils/mockData.js"></script>
    <script src="js/models/dataStore.js"></script>
    <script src="js/services/vehicleService.js"></script>
    <script src="js/services/orderService.js"></script>
    <script src="js/services/packageService.js"></script>
    <script src="js/services/memberService.js"></script>
    <script src="js/services/statisticsService.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/vehicle.js"></script>
    <script src="js/pages/order.js"></script>
    <script src="js/pages/package.js"></script>
    <script src="js/pages/member.js"></script>
    <script src="js/pages/statistics.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
