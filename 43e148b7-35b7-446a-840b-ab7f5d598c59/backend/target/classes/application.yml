server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: design-collaboration
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/design.db
    username:
    password:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.design.collaboration.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: 建筑设计院协同管理系统 API
    description: 建筑设计院协同管理系统后端接口文档
    version: 1.0.0

jwt:
  secret: design-collaboration-secret-key-2024-for-jwt-token-generation
  expiration: 86400000

file:
  upload-path: ./uploads
