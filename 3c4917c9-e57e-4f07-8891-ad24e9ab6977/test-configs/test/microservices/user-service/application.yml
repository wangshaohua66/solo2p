  datasource:
    url: jdbc:mysql://10.0.2.100:3306/bank_user_test?useUnicode=true&characterEncoding=utf8
    username: test_user
    password: TestPass@456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
