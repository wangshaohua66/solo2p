# ------------------------------------------------------------------------------
# 告警通道配置
# ------------------------------------------------------------------------------
notifier:
  dingtalk:
    webhook: https://oapi.dingtalk.com/robot/send
    access_token_env: DINGTALK_ACCESS_TOKEN
    secret_env: DINGTALK_SECRET
    at_all: false
    # 逾期/部分还款实时推送
    realtime_types: [overdue, partial]
  email:
    smtp_host: smtp.exmail.example.com
    smtp_port: 465
    secure: true
    user_env: SMTP_USER
    pass_env: SMTP_PASS
    from: 公积金还款核对系统 <no-reply@fund-center.gov.cn>
    to:
      - finance1@fund-center.gov.cn
      - finance2@fund-center.gov.cn
      - finance3@fund-center.gov.cn
    ops_to:
      - ops@fund-center.gov.cn
    subject_prefix: 【公积金还款核对】
