# ==============================================================================
# 多银行网银自动化采集配置
# 某区域住房公积金管理中心 - 公积金贷款还款流水核对系统
#
# 安全说明：所有敏感凭据（密码、PIN、短信验证码）均不硬编码于此，
#          通过环境变量 .env 注入，定位器与菜单路径仅作结构描述。
# ==============================================================================

defaults:
  # 导航层元素出现超时（毫秒）
  element_timeout: 15000
  # 单银行登录至导出完成上限（毫秒）= 5分钟
  bank_timeout: 300000
  # 登录失败自动重试次数上限
  login_max_retry: 3
  # 8家银行并行总耗时上限（毫秒）= 20分钟
  global_timeout: 1200000
  # 解析与核对阶段独立超时（毫秒）= 3分钟
  parse_reconcile_timeout: 180000
  # 内存占用峰值上限（MB），超过中止并告警
  memory_limit_mb: 512
  # 下载文件就绪轮询间隔（毫秒）
  download_poll_interval: 1000
  # 下载文件就绪超时（毫秒）
  download_ready_timeout: 60000
  # 同一元素连续定位失败阈值，达到则标记需更新配置
  locator_fail_threshold: 3
  # 截图存档目录
  screenshot_dir: ./logs/screenshots
  # 下载文件临时目录
  download_dir: ./downloads
  # 浏览器无头模式（生产环境建议 true，调试时 false）
  headless: false

# ------------------------------------------------------------------------------
# 中心业务系统应还计划对接（用于核对引擎）
# ------------------------------------------------------------------------------
center_system:
  db_path: ./data/repayments.db
  plan_table: repayment_plans
  record_table: repayment_records
  exception_table: repayment_exceptions
  change_log_table: page_change_logs

# ==============================================================================
# 银行列表
# ==============================================================================
banks:

  # 1. 中国工商银行 ICBC - U盾 + PIN
  - code: ICBC
    name: 中国工商银行
    auth_type: ukey
    base_url: https://corporate.icbc.com.cn/sper
    login:
      username_locator: { by: id, value: "txtUserId" }
      password_locator: { by: id, value: "txtPassword" }
      submit_locator:  { by: id, value: "btnLogin" }
      ukey:
        detect_command: "ls /dev | grep -i icbc"
        pin_locator: { by: id, value: "txtPin" }
        pin_env: ICBC_UKEY_PIN
        confirm_locator: { by: id, value: "btnConfirmPin" }
      success_indicator: { by: css, value: ".user-welcome" }
      success_timeout: 30000
    export:
      file_format: xlsx
      download_button: { by: id, value: "btnExport" }
      export_confirm: { by: id, value: "btnConfirmExport" }
      # 6层嵌套菜单
      path:
        - { action: click, target: { by: id, value: "nav-loan" },            desc: 贷款管理,          wait_for: { by: css, value: ".nav-sub-loan" } }
        - { action: hover, target: { by: css, value: ".nav-sub-loan .repay" }, desc: 悬停还款管理,     wait_for: { by: css, value: ".nav-repay-detail" } }
        - { action: click, target: { by: css, value: ".nav-repay-detail" },   desc: 还款明细查询,     wait_for: { by: id, value: "filter-form" } }
        - { action: click, target: { by: id, value: "tab-history" },          desc: 历史还款流水,     wait_for: { by: id, value: "date-range-start" } }
        - { action: click, target: { by: id, value: "btnQuery" },             desc: 查询上月流水,     wait_for: { by: css, value: ".repay-table tr.data-row" } }
        - { action: click, target: { by: id, value: "btnExport" },            desc: 导出Excel,        wait_for: { by: id, value: "export-confirm-dialog" } }
    mapping:
      sheet_name: 还款明细
      header_row: 2
      amount_unit: yuan
      date_format: YYYYMMDD
      fields:
        borrower_name: { header: 借款人姓名 }
        contract_no:   { header: 贷款合同号 }
        period:        { header: 还款期次 }
        due_principal: { header: 应还本金 }
        due_interest:  { header: 应还利息 }
        actual_amount: { header: 实还金额 }
        repay_date:    { header: 还款日期 }

