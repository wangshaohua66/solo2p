environments:
  development:
    driver: sqlite
    database: ./data/test_app.db
  test:
    driver: sqlite
    database: ./data/test_app_test.db
  staging:
    driver: sqlite
    database: ./data/test_app_staging.db
  production:
    driver: sqlite
    database: ./data/test_app_prod.db

migration:
  directory: migrations
  versionTable: schema_migrations
  template: default
  timestampFormat: YYYYMMDDHHmmss
  fileEncoding: utf-8

logging:
  level: info
  directory: logs
  maxFileSize: 10485760
  maxFiles: 5
  compress: true
