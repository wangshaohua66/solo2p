<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本草智方 · 中药材连锁药房管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-herb-paper">

<nav class="navbar navbar-expand-lg navbar-herb shadow-sm sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand text-white d-flex align-items-center gap-2" href="#/dashboard">
      <i class="bi bi-flower1 fs-3"></i>
      <span class="fs-5 fw-bold" style="font-family:'Noto Serif SC',serif;">本草智方</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <i class="bi bi-list text-white fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/dashboard" href="#/dashboard"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/prescription/edit" href="#/prescription/edit"><i class="bi bi-file-earmark-prescription me-1"></i>处方编辑</a></li>
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/inventory" href="#/inventory"><i class="bi bi-box-seam me-1"></i>库存管理</a></li>
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/followup" href="#/followup"><i class="bi bi-people me-1"></i>用药随访</a></li>
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/templates" href="#/templates"><i class="bi bi-collection me-1"></i>处方模板</a></li>
        <li class="nav-item"><a class="nav-link text-white-50 nav-route" data-route="#/stats" href="#/stats"><i class="bi bi-bar-chart-line me-1"></i>统计看板</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-success-subtle text-success border border-success-subtle" id="storeBadge"><i class="bi bi-shop me-1"></i>同仁堂·总店</span>
        <div class="dropdown">
          <button class="btn btn-sm btn-herb-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span id="userName">张药师</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>系统设置</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<main id="app" class="container-fluid py-4 page-enter">
</main>

<div class="modal fade" id="warningModal" tabindex="-1" aria-labelledby="warningModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger-subtle">
      <div class="modal-header bg-danger-subtle border-danger-subtle">
        <h5 class="modal-title text-danger" id="warningModalLabel"><i class="bi bi-exclamation-triangle-fill me-2"></i>配伍禁忌警示</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="warningModalBody">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="warningCancelBtn">取消并修正</button>
        <button type="button" class="btn btn-danger" id="warningConfirmBtn">确认继续（风险自负）</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/store@2.0.12/dist/store.legacy.min.js"></script>
<script src="js/herb-data.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/prescription.js"></script>
<script src="js/inventory.js"></script>
<script src="js/followup.js"></script>
<script src="js/app.js"></script>

</body>
</html>
